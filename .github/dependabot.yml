# The code is standard library only, so what to keep current is the pinned
# actions in .github/workflows and the browser tests' one dev dependency
# (@playwright/test, package.json). Monthly, one grouped PR each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      e2e:
        patterns: ["*"]
    commit-message:
      prefix: e2e
