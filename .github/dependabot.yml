# The Python is standard library only, so what to keep current is the pinned
# actions in .github/workflows and the web app's packages (package.json:
# React, TanStack, Vite and the tools, @playwright/test for the browser
# tests). Monthly, one grouped PR each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    # @types/node follows the Node the app runs on (.node-version, CI,
    # engines), so its major moves with those, by hand, never on its own.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: web
