# Keep the pinned actions and the complete application's npm dependencies
# current: React, Hono, AWS adapters, Event workers, processing and build/test
# tools share package.json. Monthly, one grouped PR for each ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    # @types/node follows the Node the app runs on (.node-version, CI,
    # engines), so its major moves with those, by hand, never on its own.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: web
