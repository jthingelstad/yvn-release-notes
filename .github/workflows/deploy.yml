name: deploy

# Deploys main once its `validate` run is green, after Jamie approves the
# `production` environment (required reviewer, main only). It publishes the
# native HTTP and worker code that changed (--only-changed) and nothing goes
# live: activation is the separate activate workflow. The build runs without
# credentials (build-release.yml); this deploy job runs only scripts/release.sh,
# as the Mac's deploy.sh does, sharing its lock and receipts.
#
# workflow_run runs this file from main with main's secrets. It is safe here
# because nothing from the triggering run is executed: the gate admits only a
# push to main in this repository, the build checks out that commit with no
# credentials, and the deploy job checks out main and refuses unless main is
# that same commit. Never check out or run a pull request's code from here.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [validate]
    types: [completed]
    branches: [main]

# One release at a time with activate.yml and never cancelled mid-run. A newer
# run waiting behind this one replaces an older waiting one, as GitHub does.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  # Only a green push to main in this repository, never a pull request's run.
  gate:
    name: gate
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - id: commit
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo "refusing: no commit" >&2; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: gate
    permissions: {}
    uses: ./.github/workflows/build-release.yml
    with:
      commit: ${{ needs.gate.outputs.commit }}

  deploy:
    name: deploy
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # Full history, so release.sh can check the commit is in main's history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # The approval can come long after the merge: deploy only main's tip; a
      # later merge has its own run.
      - name: still main
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$COMMIT" ]] \
            || { echo "refusing: main has moved on since this commit; its own run deploys it" >&2; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle
      # The role ARN is an environment secret, so the log masks it.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.RELEASE_DEPLOY_ROLE_ARN }}
          role-session-name: release-notes-deploy-${{ github.run_id }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: release
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          scripts/release.sh --bundle "$RUNNER_TEMP/bundle" --commit "$COMMIT" --repo "$GITHUB_WORKSPACE" \
            --native-http-phase=publish --native-worker-phase=publish --only-changed
