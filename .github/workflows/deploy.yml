name: deploy

# Releases main once its `validate` run is green, with no approval step
# (Jamie, 2026-10-17: a hobby project with one developer). The build job runs
# without credentials; the deploy job runs only scripts/release.sh, as the
# Mac's deploy.sh does: one stack update takes every function and endpoint to
# this commit, then the probe checks it. Roll back by reverting the merge.
# Running this from the Actions tab releases main's tip again.
#
# workflow_run runs this file from main with main's secrets. It is safe here
# because nothing from the triggering run is executed: the gate admits only a
# push to main in this repository, the build checks out that commit with no
# credentials, and the deploy job checks out main and refuses unless main is
# that same commit. Never check out or run a pull request's code from here.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [validate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One release at a time, never cancelled mid-run. A newer run waiting behind
# this one replaces an older waiting one, as GitHub does.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  # Only a green push to main in this repository, or main's tip by hand once
  # its own validate run passed; never a pull request's run.
  gate:
    name: gate
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          VALIDATED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$REF" == refs/heads/main ]] || { echo "refusing: releases run from main" >&2; exit 1; }
            COMMIT=$SHA
            green=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/check-runs?check_name=validate" \
              --jq '[.check_runs[] | select(.conclusion == "success" and .app.slug == "github-actions")] | length')
            [[ "$green" -gt 0 ]] || { echo "refusing: validate is not green on main" >&2; exit 1; }
          else
            COMMIT=$VALIDATED
          fi
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ ]] || { echo "refusing: no commit" >&2; exit 1; }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

  # The release bundle, built where no cloud credential exists: no token
  # permissions, no environment and no AWS role. scripts/build-release.sh
  # installs the locked packages without their install scripts, runs `npm run
  # verify`, stages Sharp's Linux Arm64 runtime and packages the code.
  build:
    name: build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: build the release bundle
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          [[ "$COMMIT" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$COMMIT" ]] \
            || { echo "refusing: not the requested commit" >&2; exit 1; }
          scripts/build-release.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/bundle" "$COMMIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: deploy
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The environment has no reviewers; it admits only main, and the AWS role
    # trusts only its OIDC subject.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      # Release only main's tip; a later merge has its own run.
      - name: still main
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$COMMIT" ]] \
            || { echo "refusing: main has moved on since this commit; its own run releases it" >&2; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle
      # The role ARN is an environment secret, so the log masks it.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.RELEASE_DEPLOY_ROLE_ARN }}
          role-session-name: release-notes-deploy-${{ github.run_id }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: release
        env:
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: scripts/release.sh --bundle "$RUNNER_TEMP/bundle" --commit "$COMMIT"
