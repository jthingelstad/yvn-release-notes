name: e2e

# The browser tests for sign-up (e2e/). They run by themselves on a pull
# request that changes web/ or e2e/, on any pull request labelled `e2e`
# (again on each push), and from the Actions tab (workflow_dispatch). Not a
# required check and not part of `validate`, so a change merges and deploys
# without waiting for them. A path filter on the trigger would also drop the
# label runs, so the `changes` job reads the pull request's files instead.
# They run against tools/dev-server.ts (Node 24) and its fakes: nothing live.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Same hardening as validate.yml (scripts/test-workflows.sh checks both).
permissions: {}

jobs:
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.files.outputs.web }}
    steps:
      - name: does the pull request change web/ or e2e/
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^(web|e2e)/'; then web=true; else web=false; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e
    needs: changes
    # !cancelled(): a dispatch skips `changes`, which must not skip this.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e') ||
      needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The lockfile pins @playwright/test; no package's install scripts run.
      - name: install
        run: npm ci --ignore-scripts
      - name: browser
        run: npx playwright install --with-deps chromium
      - name: browser tests
        run: npm run e2e
      - name: keep the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
