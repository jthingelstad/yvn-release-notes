name: e2e

# The browser tests for sign-up (e2e/), on demand. Not a required check and
# not part of `validate`, so a change merges and deploys without them. Run
# them from the Actions tab (workflow_dispatch) or by putting the `e2e`
# label on a pull request; a labelled PR runs them again on each push.
# They run against scripts/dev_server.py and its fakes: nothing live.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Same hardening as validate.yml (scripts/test-workflows.sh checks both).
permissions: {}

jobs:
  e2e:
    name: e2e
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The lockfile pins @playwright/test; no package's install scripts run.
      - name: install
        run: npm ci --ignore-scripts
      - name: browser
        run: npx playwright install --with-deps chromium
      - name: browser tests
        run: npm run e2e
      - name: keep the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
