name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -q > /dev/null
      - name: lint template
        run: pipx run cfn-lint infra/template.yaml
