name: validate

# The merge gate. main takes changes only through a pull request whose
# `validate` check is green on a branch up to date with main, and deploy.sh
# refuses a HEAD without a green `validate`. The job's name IS the required
# check's name in the main ruleset, deploy.sh and scripts/release.sh (which
# checks a published candidate): rename them all together or merges and
# deploys stop.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR supersedes its running check; main's runs finish.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No default token permissions; each job asks for its own. Actions are pinned
# to commit SHAs (Dependabot's monthly github-actions run moves them) and
# checkout leaves no token behind. scripts/test-workflows.sh holds every
# workflow here to that, as the first step below.
permissions: {}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: workflow lint
        run: sh scripts/test-workflows.sh
      # cfn-lint uses the runner's Python as an infrastructure lint utility;
      # the application runtime is Node 24. It is pinned like the actions;
      # Dependabot's github-actions run cannot see a pipx spec: bump it by hand (the latest on PyPI,
      # run locally first) when a new resource or property needs it.
      - name: lint templates
        run: pipx run --spec cfn-lint==1.57.2 cfn-lint infra/template.yaml infra/github-deploy-role.yaml infra/backup.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # React, Hono servers, Event workers and tools: format/lint,
      # types, unit tests and committed builds. No package install scripts run.
      - name: install
        run: npm ci --ignore-scripts
      - name: application verification
        run: npm run verify
