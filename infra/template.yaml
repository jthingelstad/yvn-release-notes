AWSTemplateFormatVersion: "2010-09-09"
Description: Release Notes for Your Version Number - a daily version-number email whose replies are kept as notes

Parameters:
  Domain:
    Type: String
    Default: yourversionnumber.com
  InboundDomain:
    Type: String
    Default: in.yourversionnumber.com
    Description: MX points at SES; every reply address lives here.
  MailFromDomain:
    Type: String
    Default: bounce.yourversionnumber.com
  FromAddress:
    Type: String
    Default: notes@yourversionnumber.com
  OpsQueueName:
    Type: String
    Default: projects-ops-alerts
    Description: The account's alerts queue. Its policy must list this stack's alarm topic.
  AdminUserId:
    Type: String
    Default: ""
    MaxLength: 80
    AllowedPattern: '^$|^[A-Za-z0-9_-]{1,80}$'
    Description: Subscriber id of the email-verified operator. Empty disables admin access; never commit a live value.
  WebDomain:
    Type: String
    Default: notes.yourversionnumber.com
  WebCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: ^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$
    Description: The us-east-1 ACM certificate for WebDomain, issued outside the stack (as Drop's is). deploy.sh passes it once ACM says ISSUED; until then the distribution answers on its cloudfront.net name only.

  RuntimeSecretName:
    Type: String
    Default: yvn-release-notes-runtime
    Description: The Secrets Manager secret holding the runtime credentials, ANTHROPIC_API_KEY (photo descriptions and book commentary) and TURNSTILE_SECRET_KEY (the sign-in Turnstile widget). Kept by hand; no deploy writes it. An empty or missing key means that feature is not set up.
  TurnstileMode:
    Type: String
    Default: ""
    AllowedValues: ["", "off", "observe", "enforce"]
    Description: TURNSTILE_MODE for the sign-in email. Empty uses the code's default (observe). Set with deploy.sh --turnstile-mode on an HTTP publish.

  SenderScheduleArn:
    Type: String
    AllowedPattern: ^arn:[^:]+:events:[^:]+:[0-9]{12}:rule/.+$
    Description: Existing sender rule ARN, read from control-plane metadata; avoids a permission/target dependency cycle without replacing the rule.
  TranscribeDoneArn:
    Type: String
    AllowedPattern: ^arn:[^:]+:events:[^:]+:[0-9]{12}:rule/.+$
    Description: Existing transcription-completion rule ARN, read from control-plane metadata; the rule itself keeps its physical name.

  # A release is one commit on main (scripts/release.sh). BuildId is in every
  # function's configuration and every revision and version, so each release
  # publishes all of them and moves `live` to them in one stack update; a
  # rollback is a revert, released like any other commit. Each code key is
  # its zip's SHA-256, written once and never changed or expired.
  BuildId:
    Type: String
    AllowedPattern: '^[a-f0-9]{40}$'
    Description: The commit on main this release was built from.
  AppCode:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 of the API zip, native/app/<hash>.zip in the source bucket.
  McpCode:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 of the MCP zip, native/mcp/<hash>.zip in the source bucket.
  SenderCode:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 of the sender zip, native/workers/sender/<hash>.zip in the source bucket.
  InboundCode:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 of the inbound zip, native/workers/inbound/<hash>.zip in the source bucket.
  EventsCode:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 of the events zip, native/workers/events/<hash>.zip in the source bucket.
  TranscribeCode:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 of the transcribe zip, native/workers/transcribe/<hash>.zip in the source bucket.
  DescribeCode:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 of the describe zip, native/workers/describe/<hash>.zip in the source bucket.
  ExportCode:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 of the export zip, native/workers/export/<hash>.zip in the source bucket.
  CaptureCode:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 of the capture zip, native/workers/capture/<hash>.zip in the source bucket.
  NativeMaxEnvironments:
    Type: Number
    Default: 8
    MinValue: 2
    MaxValue: 8
    Description: Initial budget ceiling per live endpoint; actual admission concurrency is chosen by the service.
  NativeMaxConcurrency:
    Type: Number
    Default: 64
    MinValue: 1
    MaxValue: 64
    Description: Upper bound per environment, not a guaranteed admission capacity.

Conditions:
  HasAdmin: !Not [!Equals [!Ref AdminUserId, ""]]
  HasTurnstileMode: !Not [!Equals [!Ref TurnstileMode, ""]]
  HasWebCertificate: !Not [!Equals [!Ref WebCertificateArn, ""]]

Resources:
  # The code zips, named by content and never overwritten. No lifecycle
  # expiration: deleting a source version permanently fails a revision built
  # from it, and a revert releases old code from the keys it had.
  NativeSourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  NativeSourcePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref NativeSourceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaReadsOnlyNativeRevisions
            Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub "${NativeSourceBucket.Arn}/native/*"
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
              ArnLike:
                aws:SourceArn:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${AWS::StackName}-web-native/*"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${AWS::StackName}-mcp-native/*"
          - Sid: TLSOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt NativeSourceBucket.Arn, !Sub "${NativeSourceBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # These groups are created before compute. Console.info(object) is wrapped
  # under message by Web Functions; Event Functions keep their raw JSON logs.
  NativeAppLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda-web/${AWS::StackName}-web-native"
      RetentionInDays: 90

  NativeAppLocalLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda-web/${AWS::StackName}-web-native.local"
      RetentionInDays: 90

  NativeMcpLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda-web/${AWS::StackName}-mcp-native"
      RetentionInDays: 14

  NativeMcpLocalLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda-web/${AWS::StackName}-mcp-native.local"
      RetentionInDays: 14

  NativeOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-native"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always-amz-auth
        SigningProtocol: sigv4

  # CloudFront rejects forwarding Authorization with MaxTTL=0. Min/default=0
  # and a one-second maximum permit forwarding it. EVERY HTTP response,
  # including errors, must set Cache-Control: no-store (central middleware).
  NativeHttpCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-native-http"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  NativeHttpRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-native-http"
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Origin, Content-Type, Accept, CloudFront-Viewer-Address, MCP-Protocol-Version, Mcp-Session-Id, Last-Event-ID]
        CookiesConfig:
          CookieBehavior: whitelist
          Cookies: [__Host-rn]
        QueryStringsConfig: { QueryStringBehavior: all }

  # /v1 (docs/API.md) on the MCP origin: no cookie at all, and the two
  # headers a write needs, its Idempotency-Key and the User-Agent's product.
  NativeApiRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-native-api"
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Origin, Content-Type, Accept, Idempotency-Key, User-Agent]
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: all }

  # Form-encoded scopes arrive with + for spaces. Web Function OAC signature
  # validation rejects that wire form; canonicalize spaces before signing.
  # Only OAuth uses this function; values and repeated parameters are preserved.
  NativeOAuthQueryFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-oauth-query"
      AutoPublish: true
      FunctionConfig:
        Comment: Normalize form-encoded OAuth query spaces before private origin signing
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var query = [];
          var changed = false;
          Object.keys(request.querystring).forEach(function (key) {
            var field = request.querystring[key];
            var values = field.multiValue || [field];
            var name = key.replace(/\+/g, '%20');
            if (name !== key) changed = true;
            values.forEach(function (entry) {
              var value = entry.value.replace(/\+/g, '%20');
              if (value !== entry.value) changed = true;
              query.push(name + '=' + value);
            });
          });
          if (changed) request.querystring = query.join('&');
          return request;
        }

  # Resource policies have one owner: tools/web-platform.ts. The current
  # AWS::Lambda::ResourcePolicy registry schema excludes web-function ARNs.
  # Each release installs a missing one and checks an existing one is exactly
  # the distribution/live-endpoint grant; no release removes or rewrites one.
  NativeAppFunction:
    Type: AWS::Lambda::WebFunction
    Properties:
      FunctionName: !Sub "${AWS::StackName}-web-native"

  NativeAppRevision:
    Type: AWS::Lambda::WebFunctionRevision
    # Every release builds a new one (its Description is the build) and the
    # live endpoint moves to it in the same update; once that succeeds the
    # one it replaced is deleted.
    DependsOn: [NativeAppFunction, NativeSourcePolicy]
    Properties:
      # The provider normalizes ARN inputs to names; using an ARN breaks its
      # later read/rollback. Depend on the function, pass its bare name.
      FunctionName: !Sub "${AWS::StackName}-web-native"
      Description: !Ref BuildId
      BuildConfig:
        CodeConfig:
          S3Object:
            Bucket: !Ref NativeSourceBucket
            Key: !Sub "native/app/${AppCode}.zip"
        RuntimeConfig: { Runtime: nodejs24.x }
      ServiceConfig:
        ExecutionRoleArn: !GetAtt WebRole.Arn
        TimeoutSeconds: 28
        MaxConcurrencyPerEnvironment: !Ref NativeMaxConcurrency
        EnvironmentVariables:
          TABLE: !Ref Table
          MAIL_BUCKET: !Ref MailBucket
          WEB_ORIGIN: !Sub "https://${WebDomain}"
          APP_VERSION: !Ref BuildId
          FROM_ADDRESS: !Ref FromAddress
          CONFIG_SET: !Ref ConfigurationSet
          INBOUND_DOMAIN: !Ref InboundDomain
          SENDER_FUNCTION: !Ref SenderAlias
          EXPORT_FUNCTION: !Ref ExportAlias
          ADMIN_USER_ID: !If [HasAdmin, !Ref AdminUserId, !Ref AWS::NoValue]
          RUNTIME_SECRET: !Ref RuntimeSecretName
          TURNSTILE_MODE: !If [HasTurnstileMode, !Ref TurnstileMode, !Ref AWS::NoValue]
        TelemetryConfig:
          LoggingConfig:
            LogGroup: !Ref NativeAppLogs
            ApplicationLogLevel: INFO
            SystemLogLevel: INFO

  NativeAppLiveEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    DependsOn: NativeAppFunction
    Properties:
      FunctionName: !Sub "${AWS::StackName}-web-native"
      EndpointName: live
      EndpointType: HomeRegion
      AuthType: IamAuth
      # Explicit weights imply Disabled auto-deployment (verified on AWS): the
      # endpoint serves the revision this stack names, never a newer one.
      RevisionWeights:
        - RevisionId: !GetAtt NativeAppRevision.RevisionId
          Weight: 100
      ScalingConfig:
        MaxEnvironments: !Ref NativeMaxEnvironments
      ThrottleConfig: { RateLimit: 100 }

  NativeMcpFunction:
    Type: AWS::Lambda::WebFunction
    Properties:
      FunctionName: !Sub "${AWS::StackName}-mcp-native"

  NativeMcpRevision:
    Type: AWS::Lambda::WebFunctionRevision
    # Every release builds a new one (its Description is the build) and the
    # live endpoint moves to it in the same update; once that succeeds the
    # one it replaced is deleted.
    DependsOn: [NativeMcpFunction, NativeSourcePolicy]
    Properties:
      # The provider normalizes ARN inputs to names; using an ARN breaks its
      # later read/rollback. Depend on the function, pass its bare name.
      FunctionName: !Sub "${AWS::StackName}-mcp-native"
      Description: !Ref BuildId
      BuildConfig:
        CodeConfig:
          S3Object:
            Bucket: !Ref NativeSourceBucket
            Key: !Sub "native/mcp/${McpCode}.zip"
        RuntimeConfig: { Runtime: nodejs24.x }
      ServiceConfig:
        ExecutionRoleArn: !GetAtt McpRole.Arn
        TimeoutSeconds: 28
        MaxConcurrencyPerEnvironment: !Ref NativeMaxConcurrency
        EnvironmentVariables:
          TABLE: !Ref Table
          MAIL_BUCKET: !Ref MailBucket
          WEB_ORIGIN: !Sub "https://${WebDomain}"
          APP_VERSION: !Ref BuildId
          CAPTURE_FUNCTION: !Ref CaptureAlias
        TelemetryConfig:
          LoggingConfig:
            LogGroup: !Ref NativeMcpLogs
            ApplicationLogLevel: INFO
            SystemLogLevel: INFO

  NativeMcpLiveEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    DependsOn: NativeMcpFunction
    Properties:
      FunctionName: !Sub "${AWS::StackName}-mcp-native"
      EndpointName: live
      EndpointType: HomeRegion
      AuthType: IamAuth
      # Explicit weights imply Disabled auto-deployment (verified on AWS): the
      # endpoint serves the revision this stack names, never a newer one.
      RevisionWeights:
        - RevisionId: !GetAtt NativeMcpRevision.RevisionId
          Weight: 100
      ScalingConfig:
        MaxEnvironments: !Ref NativeMaxEnvironments
      ThrottleConfig: { RateLimit: 100 }

  NativeSignInTotalMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NativeAppLogs
      FilterPattern: '{ $.message.event = "mail-limited" && $.message.limit = "total" }'
      MetricTransformations:
        - MetricNamespace: ReleaseNotes
          MetricName: SignInTotalLimited
          MetricValue: "1"

  NativeMcpFailuresMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NativeMcpLogs
      FilterPattern: '{ $.message.event = "mcp-error" }'
      MetricTransformations:
        - MetricNamespace: ReleaseNotes
          MetricName: McpFailures
          MetricValue: "1"

  # A change on the web whose activity row was not written; the change still
  # stood. Counts only. (The capture worker counts its own in the same metric.)
  NativeAppActivityUnrecordedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NativeAppLogs
      FilterPattern: '{ $.message.event = "activity-unrecorded" }'
      MetricTransformations:
        - MetricNamespace: ReleaseNotes
          MetricName: ActivityUnrecorded
          MetricValue: "1"

  # An assistant's reads that never reached the activity log; the call still
  # answered. Counts only.
  NativeMcpActivityUnrecordedMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NativeMcpLogs
      FilterPattern: '{ $.message.event = "activity-unrecorded" }'
      MetricTransformations:
        - MetricNamespace: ReleaseNotes
          MetricName: ActivityUnrecorded
          MetricValue: "1"

  NativeAppErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-web-native-errors"
      AlarmDescription: Native web endpoint returned a server error; counts only.
      Namespace: AWS/Lambda/Web
      MetricName: HTTPResponseStatusClass5XX
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-web-native" }
        - { Name: EndpointName, Value: live }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NativeAppCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-web-native-capacity"
      AlarmDescription: Native web endpoint refused a request at its environment ceiling; counts only.
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointActiveEnvironmentThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-web-native" }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NativeAppRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-web-native-rate"
      AlarmDescription: Native web endpoint refused a request at its rate ceiling; counts only.
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointRequestThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-web-native" }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NativeMcpErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-mcp-native-errors"
      AlarmDescription: Native mcp endpoint returned a server error; counts only.
      Namespace: AWS/Lambda/Web
      MetricName: HTTPResponseStatusClass5XX
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-mcp-native" }
        - { Name: EndpointName, Value: live }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NativeMcpCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-mcp-native-capacity"
      AlarmDescription: Native mcp endpoint refused a request at its environment ceiling; counts only.
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointActiveEnvironmentThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-mcp-native" }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NativeMcpRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-mcp-native-rate"
      AlarmDescription: Native mcp endpoint refused a request at its rate ceiling; counts only.
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointRequestThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-mcp-native" }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # --- storage ------------------------------------------------------------

  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref AWS::StackName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      # Sign-in links, sessions and rate-limit counters carry expires_at
      # (epoch seconds) and clear themselves. Nothing kept for good sets it.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      # Read by the transcriber only: a note with a recording, or the
      # setting just turned on (workers/transcribe.ts).
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # Raw inbound mail under raw/. Filed replies are kept; their photos and
  # recordings are copied to media/ (packages/backend/media.ts) and kept too. Ignored mail
  # expires, and so do zip exports (exports/, offered for a day).
  MailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-mail-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      # The web app sends files straight here, with a form web.start_upload
      # signs (packages/backend/media.ts); the page must be able to read S3's answer.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Sub "https://${WebDomain}"]
            AllowedMethods: [POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: expire-pending-uploads
            # A file sent from the web that no note took within a day.
            Status: Enabled
            TagFilters:
              - { Key: outcome, Value: pending }
            ExpirationInDays: 1
          - Id: expire-ignored-mail
            Status: Enabled
            TagFilters:
              - { Key: outcome, Value: ignored }
            ExpirationInDays: 30
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: expire-transcripts
            # A finished job's JSON, which the transcriber deletes once the
            # words are on the note; any it missed go here.
            Status: Enabled
            Prefix: transcripts/
            ExpirationInDays: 2
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-exports
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 2
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SesWritesInboundMail
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${MailBucket.Arn}/raw/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${AWS::StackName}:receipt-rule/*"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt MailBucket.Arn
              - !Sub "${MailBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # --- sending --------------------------------------------------------------

  ConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Ref AWS::StackName
      ReputationOptions:
        ReputationMetricsEnabled: true
      SuppressionOptions:
        SuppressedReasons: [BOUNCE, COMPLAINT]

  # Delivery problems go to the events function only (workers/events.ts): SES's
  # event carries the address, the subject (a sign-in code) and the reply
  # token, so it never goes to the ops queue as is. The function sends the
  # queue a line with the kind and the user id. No open or click events.
  ConfigurationSetEvents:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: mail-events
        Enabled: true
        MatchingEventTypes: [bounce, complaint, reject, renderingFailure, deliveryDelay]
        SnsDestination:
          TopicARN: !Ref MailEventsTopic

  # Every email counted in CloudWatch for the dashboard, by its kind (the
  # release-notes-mail tag: daily or account). Counts only; still no open
  # or click events.
  ConfigurationSetMetrics:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: mail-metrics
        Enabled: true
        MatchingEventTypes: [send, delivery, bounce, complaint, reject]
        CloudWatchDestination:
          DimensionConfigurations:
            - DimensionName: release-notes-mail
              DimensionValueSource: messageTag
              DefaultDimensionValue: other

  MailEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-mail-events"

  MailEventsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref MailEventsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SesEvents
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref MailEventsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref Domain
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref ConfigurationSet
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      MailFromAttributes:
        MailFromDomain: !Ref MailFromDomain
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  # --- receiving ------------------------------------------------------------

  ReceiptRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: !Ref AWS::StackName

  ReceiptRule:
    Type: AWS::SES::ReceiptRule
    DependsOn: [MailBucketPolicy, InboundAliasInvokePermission]
    Properties:
      RuleSetName: !Ref ReceiptRuleSet
      Rule:
        Name: replies
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Optional
        Recipients: [!Ref InboundDomain]
        Actions:
          - S3Action:
              BucketName: !Ref MailBucket
              ObjectKeyPrefix: raw/
          - LambdaAction:
              FunctionArn: !Ref InboundAlias
              InvocationType: Event

  # --- functions ------------------------------------------------------------

  SenderLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-sender"
      RetentionInDays: 90

  InboundLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-inbound"
      RetentionInDays: 90

  SenderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sender
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # DeleteItem: a failed send's reply address (store.drop_day),
                # and a standing address the profile did not take (set_inbox).
                Action: [dynamodb:Scan, dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem,
                         dynamodb:DeleteItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # Day/token commits prove the account remains active in the transaction.
                Action: dynamodb:ConditionCheckItem
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*"]
              - Effect: Allow
                # The sender passes Content.Raw to SESv2 SendEmail, which SES
                # authorizes as ses:SendRawEmail. Recipients whose address is a
                # verified identity in this account are checked too, hence
                # identity/* rather than the sending domain alone.
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}"
                Condition:
                  # Only as Release Notes (compose.from_header hands SES
                  # "Release Notes <notes@...>"), never as another identity
                  # in this shared account.
                  StringLike:
                    ses:FromAddress:
                      - !Ref FromAddress
                      - !Sub "*<${FromAddress}>"
              - Effect: Allow
                # Photos in the email: their thumbnails only (packages/backend/thumbs.ts),
                # never an original.
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/media/*.thumb.jpg"
              - Effect: Allow
                # S3 answers a read of a missing file 404 only to a role that
                # may list the bucket, and 403 to any other; a thumbnail gone
                # missing is skipped on 404 and fails the photos on 403.
                Action: s3:ListBucket
                Resource: !GetAtt MailBucket.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt SenderLogs.Arn

  InboundRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: inbound
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObjectTagging]
                Resource: !Sub "${MailBucket.Arn}/raw/*"
              - Effect: Allow
                # A retry must preserve a previously filed raw message's retention.
                Action: s3:GetObjectTagging
                Resource: !Sub "${MailBucket.Arn}/raw/*"
              - Effect: Allow
                # Pending copies are promoted or cleaned after the guarded note write.
                Action: [s3:PutObjectTagging, s3:DeleteObject]
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # A reply's photos and recordings, copied out of it.
                Action: s3:PutObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # UpdateItem: a late reply's notice, marked on its reply
                # address and counted against the subscriber's day.
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # Atomic live-profile proof and account-owned processing/commit state.
                Action: dynamodb:ConditionCheckItem
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*"]
              - Effect: Allow
                # The owner's notes, pauses and weather, read for the badges a
                # filed note earned (its activity rows).
                Action: dynamodb:Query
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*"]
              - Effect: Allow
                # The late-reply notice, as raw MIME through SESv2 (see SenderRole).
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}"
                Condition:
                  # Only as Release Notes, like the sender and web roles.
                  StringLike:
                    ses:FromAddress:
                      - !Ref FromAddress
                      - !Sub "*<${FromAddress}>"
              - Effect: Allow
                # A message still failing after its retries goes to the
                # inbound failed queue (InboundAliasInvokeConfig), which this
                # function reads (InboundFailedSource) to log it and hand it on
                # to the failed queue.
                Action: sqs:SendMessage
                Resource:
                  - !GetAtt InboundFailedQueue.Arn
                  - !GetAtt FailedQueue.Arn
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: !GetAtt InboundFailedQueue.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt InboundLogs.Arn

  SenderFunction:
    Type: AWS::Lambda::Function
    DependsOn: NativeSourcePolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-sender"
      Description: Sends the daily version-number email
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      Code:
        S3Bucket: !Ref NativeSourceBucket
        S3Key: !Sub "native/workers/sender/${SenderCode}.zip"
      Role: !GetAtt SenderRole.Arn
      MemorySize: 256
      Timeout: 120
      LoggingConfig:
        # Event stdout JSON/EMF remains unwrapped; HTTP function logs use message.*.
        LogFormat: Text
        LogGroup: !Ref SenderLogs
      Environment:
        Variables:
          APP_VERSION: !Ref BuildId
          TABLE: !Ref Table
          FROM_ADDRESS: !Ref FromAddress
          INBOUND_DOMAIN: !Ref InboundDomain
          CONFIG_SET: !Ref ConfigurationSet
          BUCKET: !Ref MailBucket

  InboundFunction:
    Type: AWS::Lambda::Function
    DependsOn: NativeSourcePolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-inbound"
      Description: Files email replies as release notes
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      Code:
        S3Bucket: !Ref NativeSourceBucket
        S3Key: !Sub "native/workers/inbound/${InboundCode}.zip"
      Role: !GetAtt InboundRole.Arn
      MemorySize: 512
      Timeout: 60
      LoggingConfig:
        # Event stdout JSON/EMF remains unwrapped; HTTP function logs use message.*.
        LogFormat: Text
        LogGroup: !Ref InboundLogs
      Environment:
        Variables:
          APP_VERSION: !Ref BuildId
          TABLE: !Ref Table
          BUCKET: !Ref MailBucket
          INBOUND_DOMAIN: !Ref InboundDomain
          FROM_ADDRESS: !Ref FromAddress
          CONFIG_SET: !Ref ConfigurationSet
          FAILED_QUEUE: !Ref FailedQueue

  SenderSchedule:
    Type: AWS::Events::Rule
    DependsOn: SenderAliasSchedulePermission
    Properties:
      Description: Run the Release Notes sender every 15 minutes
      ScheduleExpression: cron(0/15 * * * ? *)
      State: ENABLED
      Targets:
        - Id: sender
          Arn: !Ref SenderAlias

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-web-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ListBucket so a missing page is an honest 404, not S3's 403.
          - Sid: CloudFrontReads
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: [s3:GetObject, s3:ListBucket]
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        Description: Private access from the Release Notes distribution to its web bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The web app is one page: any address but a file (/settings/,
  # /day/?d=...) is index.html, and the app's router shows the page. / alone
  # is front.html, the same page with the front page drawn in at build time
  # for readers that run no script (web/src/prerender.tsx). The public pages
  # (site/, drawn by web/src/site.tsx) are their own: each of PAGES is its
  # own index.html, and its address without the final slash is sent to it,
  # so each page has one address. Any other address under one of PUBLIC (a
  # mistyped /guide/ page, say) is index.html too, whose Not found the
  # function sends as a 404 when the answer goes back (viewer-response).
  # PAGES is the pages site/ has and PUBLIC their folders
  # (tests-node/infra/web-index.test.ts). A file (a name with a dot) is
  # served as is. /api/* never runs it.
  WebIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-index"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve the app for every address that is not a file or a public page
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        var PAGES = [
          '/changelog/',
          '/faq/',
          '/features/',
          '/guide/',
          '/guide/address/',
          '/guide/agents/',
          '/guide/api/',
          '/guide/api/clients/',
          '/guide/badges/',
          '/guide/book/',
          '/guide/changelog/',
          '/guide/delete/',
          '/guide/export/',
          '/guide/pause-and-stop/',
          '/guide/photos-and-voice/',
          '/guide/places-and-map/',
          '/guide/replying/',
          '/guide/start/',
          '/guide/tags-and-search/',
          '/guide/the-email/',
          '/guide/tokens/',
          '/guide/upcoming/',
          '/how-it-works/',
          '/privacy/'
        ];
        var PUBLIC = ['/changelog/', '/faq/', '/features/', '/guide/', '/how-it-works/', '/privacy/'];
        // An address under a section that is none of its pages: Not found.
        function missing(uri) {
          if (uri.lastIndexOf('.') > uri.lastIndexOf('/')) return false;
          var page = uri.charAt(uri.length - 1) === '/' ? uri : uri + '/';
          if (PAGES.indexOf(page) !== -1) return false;
          for (var i = 0; i < PUBLIC.length; i++) if (page.indexOf(PUBLIC[i]) === 0) return true;
          return false;
        }
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (event.context.eventType === 'viewer-response') {
            var response = event.response;
            if (response.statusCode === 200 && missing(uri)) {
              response.statusCode = 404;
              response.statusDescription = 'Not Found';
            }
            return response;
          }
          if (uri === '/') {
            request.uri = '/front.html';
            return request;
          }
          if (uri.lastIndexOf('.') > uri.lastIndexOf('/')) return request;
          if (PAGES.indexOf(uri) !== -1) {
            request.uri = uri + 'index.html';
            return request;
          }
          if (PAGES.indexOf(uri + '/') !== -1)
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: uri + '/' } }
            };
          request.uri = '/index.html';
          return request;
        }

  WebCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-static"
        Comment: Static pages, honouring the Cache-Control deploy.sh sets
        DefaultTTL: 300
        MinTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true

  # Pages load only their own files: no inline script or style, nothing
  # remote. Lookups that need another service (the city search) go through
  # /api. connect-src adds Tinylytics, for the app's page count, and the
  # mail bucket's host, for uploads. Photos and recordings come from that
  # host, by a link the API signs for their owner (img-src and media-src
  # name only that host).
  # media-src also takes blob:, so a recording made on the page plays back
  # before it is sent. Permissions-Policy lets the page itself use the
  # microphone (the new-note form's Record button) and the location (its
  # Here button, asked only on a tap or with "Add where I am" on), and turns
  # off the camera, payment and USB, which the app never asks for.
  WebHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-web"
        Comment: Security headers for notes.yourversionnumber.com
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data: https://${MailBucket.RegionalDomainName}; media-src 'self' blob: https://${MailBucket.RegionalDomainName}; font-src 'self'; connect-src 'self' https://tinylytics.app https://${MailBucket.RegionalDomainName}; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: same-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: false
            Preload: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "microphone=(self), camera=(), geolocation=(self), payment=(), usb=()"
              Override: true

  # robots.txt and sitemap.xml are read by people too, in the browser's own
  # viewer, which styles an XML file inline and draws its arrows from data:
  # images. The app's CSP refuses both, and Chrome then shows the sitemap as
  # an unstyled tree with "..." where it would fold. These two files run no
  # script and load nothing, so they get a CSP that allows only that viewer;
  # the other headers are the app's.
  PlainFilesHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-plain"
        Comment: Security headers for robots.txt and sitemap.xml
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: "default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; frame-ancestors 'none'; base-uri 'none'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: same-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: false
            Preload: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "microphone=(), camera=(), geolocation=(), payment=(), usb=()"
              Override: true

  # Static assets and both private HTTP origins share one distribution.
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Release Notes web app and its same-origin API
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        # / is front.html whichever comes first, this or WebIndexFunction.
        DefaultRootObject: front.html
        Aliases: !If [HasWebCertificate, [!Ref WebDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasWebCertificate
          - AcmCertificateArn: !Ref WebCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: native-app
            DomainName: !GetAtt NativeAppLiveEndpoint.DomainName
            OriginAccessControlId: !Ref NativeOriginAccessControl
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: native-mcp
            DomainName: !GetAtt NativeMcpLiveEndpoint.DomainName
            OriginAccessControlId: !Ref NativeOriginAccessControl
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref WebCachePolicy
          ResponseHeadersPolicyId: !Ref WebHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebIndexFunction.FunctionMetadata.FunctionARN
            - EventType: viewer-response
              FunctionARN: !GetAtt WebIndexFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # The two plain files, as the default serves them but for the CSP.
          - PathPattern: /robots.txt
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref WebCachePolicy
            ResponseHeadersPolicyId: !Ref PlainFilesHeadersPolicy
          - PathPattern: /sitemap.xml
            TargetOriginId: web
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref WebCachePolicy
            ResponseHeadersPolicyId: !Ref PlainFilesHeadersPolicy
          # Every dynamic response is no-store; OAC signs the private HTTP origins.
          - PathPattern: /api/*
            TargetOriginId: native-app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref NativeHttpCachePolicy
            OriginRequestPolicyId: !Ref NativeHttpRequestPolicy
            ResponseHeadersPolicyId: !Ref WebHeadersPolicy

          - PathPattern: /mcp
            TargetOriginId: native-mcp
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref NativeHttpCachePolicy
            # The custom cache/request policies preserve bearer and MCP headers.
            # The cookie is ignored by the separate MCP handler.
            OriginRequestPolicyId: !Ref NativeHttpRequestPolicy
          # The public API, served by the MCP function (server/mcp/v1.ts).
          - PathPattern: /v1/*
            TargetOriginId: native-mcp
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref NativeHttpCachePolicy
            OriginRequestPolicyId: !Ref NativeApiRequestPolicy
          - PathPattern: /oauth/*
            TargetOriginId: native-app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref NativeHttpCachePolicy
            OriginRequestPolicyId: !Ref NativeHttpRequestPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt NativeOAuthQueryFunction.FunctionMetadata.FunctionARN
          - PathPattern: /.well-known/oauth-*
            TargetOriginId: native-app
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref NativeHttpCachePolicy
            OriginRequestPolicyId: !Ref NativeHttpRequestPolicy

  # Historical count-only logs; no role grants or filters write here anymore.
  WebLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-web"
      RetentionInDays: 90

  # The distribution's access log, kept 24 months like the other sites'. The
  # fields leave out the client IP, the query string and the path: a private
  # calendar link is its token in the path (/api/calendar/<token>.ics), and
  # that link is never logged.
  WebAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/${AWS::StackName}/web-access"
      RetentionInDays: 731

  WebAccessLogSource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: !Sub "${AWS::StackName}-web-access"
      LogType: ACCESS_LOGS
      ResourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  WebAccessLogDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub "${AWS::StackName}-web-access"
      OutputFormat: json
      DestinationResourceArn: !GetAtt WebAccessLogs.Arn

  WebAccessLogDelivery:
    Type: AWS::Logs::Delivery
    Properties:
      DeliverySourceName: !Ref WebAccessLogSource
      DeliveryDestinationArn: !GetAtt WebAccessLogDestination.Arn
      RecordFields:
        - timestamp(ms)
        - cs-method
        - sc-status
        - sc-bytes
        - sc-range-start
        - sc-range-end
        - time-taken
        - time-to-first-byte
        - x-edge-result-type
        - x-edge-detailed-result-type
        - x-edge-location
        - cs-protocol
        - cs(User-Agent)

  # The web function's role; worker invocation is qualified.
  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: web
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # Sign-up writes the EMAIL and PROFILE items in one transaction,
                # which IAM authorizes as a PutItem for each. Deleting an
                # account deletes its items in batches.
                Action:
                  - dynamodb:ConditionCheckItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # The admin overview scans only metadata; it cannot request
                # journal contents, files, locations or credential attributes.
                Action: dynamodb:Scan
                Resource: !GetAtt Table.Arn
                Condition:
                  StringEquals:
                    dynamodb:Select: SPECIFIC_ATTRIBUTES
                  ForAllValues:StringEquals:
                    dynamodb:Attributes: [pk, sk, email, status, stopped_reason,
                      created_at, tz, send_time, last_sent_date, pause_from,
                      pause_through, written_at, received_at, source, updated_at,
                      mcp_deleting]
              - Effect: Allow
                # The runtime secret, for the sign-in Turnstile widget's secret
                # (packages/backend/turnstile.ts), and no other secret.
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${RuntimeSecretName}-??????"
              - Effect: Allow
                # The sign-in email, as raw MIME through SESv2 (see SenderRole).
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}"
                Condition:
                  # Only as Release Notes (compose.from_header hands SES
                  # "Release Notes <notes@...>"), never as another identity
                  # in this shared account.
                  StringLike:
                    ses:FromAddress:
                      - !Ref FromAddress
                      - !Sub "*<${FromAddress}>"
              - Effect: Allow
                # Deleting an emailed note (or the account) deletes the emails
                # behind it. The bucket is versioned: old versions expire 30
                # days on. DeleteObjects is authorized per object as this.
                Action: s3:DeleteObject
                Resource:
                  - !Sub "${MailBucket.Arn}/raw/*"
                  - !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # Signs the ten-minute link to a photo or recording for its
                # owner (web.media_file), and the link to a built zip export.
                # Nothing under raw/.
                Action: s3:GetObject
                Resource:
                  - !Sub "${MailBucket.Arn}/media/*"
                  - !Sub "${MailBucket.Arn}/exports/*"
              - Effect: Allow
                # Files from the web (packages/backend/media.ts): signs the form that sends one
                # straight to the bucket, tagged pending (the form posts as
                # this role, so it needs the put and the tag), reads its
                # tags and first bytes, then copies the version it checked
                # and deletes that version once a note takes it.
                Action:
                  - s3:PutObject
                  - s3:PutObjectTagging
                  - s3:GetObjectTagging
                  # Native attachment checks bind tags to the exact uploaded
                  # version; ordinary GetObjectTagging does not authorize it.
                  - s3:GetObjectVersionTagging
                  - s3:GetObjectVersion
                  - s3:DeleteObjectVersion
                Resource: !Sub "${MailBucket.Arn}/media/*/web/*"
              - Effect: Allow
                # Where that copy is kept, tagged kept: no form writes here.
                # A profile photo's copy is kept under profile/ (profile-photo.ts).
                Action: [s3:PutObject, s3:PutObjectTagging]
                Resource:
                  - !Sub "${MailBucket.Arn}/media/*/files/*"
                  - !Sub "${MailBucket.Arn}/media/*/profile/*"
              - Effect: Allow
                # Feedback screenshots (packages/backend/feedback.ts), sent in
                # the request body and stripped of metadata before they are put.
                Action: s3:PutObject
                Resource: !Sub "${MailBucket.Arn}/media/*/feedback/*"
              - Effect: Allow
                # A new zip export replaces the last; deleting the account
                # deletes it.
                Action: s3:DeleteObject
                Resource: !Sub "${MailBucket.Arn}/exports/*"
              - Effect: Allow
                # Deleting the account lists what is left under the owner's
                # media/ and exports/ prefixes, to delete it too
                # (accounts.ts deleteAccount). No prefix condition: S3
                # answers a read of a missing file 404 only to a role that
                # may list the bucket, and a read carries no prefix, so a
                # condition turned an upload that never arrived into 403.
                Action: s3:ListBucket
                Resource: !GetAtt MailBucket.Arn
              - Effect: Allow
                # Only the stable qualified worker entry point.
                Action: lambda:InvokeFunction
                Resource: !Ref ExportAlias
              - Effect: Allow
                # Only the stable qualified worker entry point.
                Action: lambda:InvokeFunction
                Resource: !Ref SenderAlias
              - Effect: Allow
                # Starting the emails again after a hard bounce or complaint
                # takes the address off SES's account-level suppression list
                # (the owner settings action). The permission takes no resource ARN.
                Action: ses:DeleteSuppressedDestination
                Resource: "*"
              - Effect: Allow
                # Naming the device's spot for a note's Here: its city,
                # neighbourhood and nearby businesses (POST /api/places/here,
                # places.nameSpot).
                Action: geo-places:ReverseGeocode
                Resource: !Sub "arn:${AWS::Partition}:geo-places:${AWS::Region}::provider/default"
              - Effect: Allow
                # The Map page's base map, passed through to the signed-in
                # owner from this origin (/api/map/*, maps.geoMaps). GetTile is
                # the only Maps IAM action: the style, glyphs and sprites
                # calls need no permission.
                Action: geo-maps:GetTile
                Resource: !Sub "arn:${AWS::Partition}:geo-maps:${AWS::Region}::provider/default"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !GetAtt NativeAppLogs.Arn
                  - !GetAtt NativeAppLocalLogs.Arn

  # Historical MCP count-only logs stay managed and retained for operations.
  McpLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-mcp"
      RetentionInDays: 14

  McpRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-only-notes
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:ConditionCheckItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*", "OAUTHACCESS#*", "OAUTHFAMILY#*", "MCPMETA#*"]
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["MCPMETA#*"]
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # Only the stable qualified worker entry point.
                Action: lambda:InvokeFunction
                Resource: !Ref CaptureAlias
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !GetAtt NativeMcpLogs.Arn
                  - !GetAtt NativeMcpLocalLogs.Arn

  CaptureLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-capture"
      RetentionInDays: 14

  CaptureRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: owner-approved-capture
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*", "OAUTHACCESS#*", "OAUTHFAMILY#*", "MCPMETA#*"]
              # Upcoming writes read the owner's saved dates first.
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*"]
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*", "MCPMETA#*"]
              - Effect: Allow
                Action: [dynamodb:UpdateItem, dynamodb:DeleteItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*"]
              # A token's upload form (POST /v1/uploads) counts one more file
              # on the account's day, with the web's (uploads.ts).
              - Effect: Allow
                Action: [dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["RATE#upload:*"]
              # An assistant's feedback screenshots (notes_send_feedback),
              # stripped of metadata first; put only, never read or deleted.
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${MailBucket.Arn}/media/*/feedback/*"
              - Effect: Allow
                # Files an agent sends with a note (media:write), and a
                # token's checked uploads, kept where a web upload's checked
                # copy is, tagged kept, and removed again when no note takes
                # them or the token deletes its note. Nothing here is read.
                Action: [s3:PutObject, s3:PutObjectTagging, s3:DeleteObject]
                Resource: !Sub "${MailBucket.Arn}/media/*/files/*"
              - Effect: Allow
                # A token's files (POST /v1/uploads, uploads.ts), as the web
                # role takes the web's: signs the form that sends one
                # straight to the bucket under media/<user>/api/, tagged
                # pending (the form posts as this role, so it needs the put
                # and the tag), reads its first bytes and that version's tags
                # and size, copies that version to files/, and deletes it
                # once a note has the copy. Never the web's media/<user>/web/.
                Action:
                  - s3:PutObject
                  - s3:PutObjectTagging
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetObjectVersionTagging
                  - s3:DeleteObjectVersion
                Resource: !Sub "${MailBucket.Arn}/media/*/api/*"
              - Effect: Allow
                # S3 answers a read of an upload that never arrived 404 only
                # to a role that may list the bucket, and a read carries no
                # prefix to narrow this by (as for the web role). This
                # function never lists.
                Action: s3:ListBucket
                Resource: !GetAtt MailBucket.Arn
              - Effect: Allow
                # A token's Here (POST /v1/places/here): names a device's
                # spot, as the web's Here does (places.nameSpot).
                Action: geo-places:ReverseGeocode
                Resource: !Sub "arn:${AWS::Partition}:geo-places:${AWS::Region}::provider/default"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CaptureLogs.Arn

  CaptureFunction:
    Type: AWS::Lambda::Function
    DependsOn: NativeSourcePolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-capture"
      Description: Private owner-approved MCP capture; create, append, edit own notes, add files, and file feedback
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      Code:
        S3Bucket: !Ref NativeSourceBucket
        S3Key: !Sub "native/workers/capture/${CaptureCode}.zip"
      Role: !GetAtt CaptureRole.Arn
      MemorySize: 1024
      Timeout: 20
      LoggingConfig:
        # Event stdout JSON/EMF remains unwrapped; HTTP function logs use message.*.
        LogFormat: Text
        LogGroup: !Ref CaptureLogs
      Environment:
        Variables:
          APP_VERSION: !Ref BuildId
          TABLE: !Ref Table
          MAIL_BUCKET: !Ref MailBucket
          WEB_ORIGIN: !Sub "https://${WebDomain}"

  ExportLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-export"
      RetentionInDays: 90

  ExportRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: export
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # Atomic live-profile proof and account-owned processing/commit state.
                Action: dynamodb:ConditionCheckItem
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*"]
              - Effect: Allow
                # The photos and recordings that go in. Nothing under raw/.
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # S3 answers a read of a missing file 404 only to a role that
                # may list the bucket, and 403 to any other; a file gone
                # missing is left out on 404 and fails the export on 403.
                Action: s3:ListBucket
                Resource: !GetAtt MailBucket.Arn
              - Effect: Allow
                # The zip, uploaded in parts when large; a replaced build
                # deletes its own.
                Action: [s3:PutObject, s3:AbortMultipartUpload, s3:DeleteObject]
                Resource: !Sub "${MailBucket.Arn}/exports/*"
              - Effect: Allow
                # The runtime secret, for the Anthropic API key, read only for
                # a book with Claude's commentary. It is kept by hand outside
                # the stack; the ?????? is the suffix Secrets Manager adds.
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${RuntimeSecretName}-??????"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ExportLogs.Arn

  ExportFunction:
    Type: AWS::Lambda::Function
    DependsOn: NativeSourcePolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-export"
      Description: Builds a subscriber's zip export, or a book of their notes as a PDF
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      Code:
        S3Bucket: !Ref NativeSourceBucket
        S3Key: !Sub "native/workers/export/${ExportCode}.zip"
      Role: !GetAtt ExportRole.Arn
      # A book decodes and resizes up to 1,000 photos (a 12 MP HEIC is about
      # 1.4 s of a full core) and typesets them; CPU comes with memory.
      MemorySize: 3008
      Timeout: 900
      # At most two builds at once, whoever asks. A build started past that
      # is throttled, and Lambda tries an async event again for up to six
      # hours (MaximumRetryAttempts counts function errors, not throttles).
      ReservedConcurrentExecutions: 2
      # The zip or book is written to local disk before it is uploaded.
      # Billed only while a build runs.
      EphemeralStorage:
        Size: 10240
      LoggingConfig:
        # Event stdout JSON/EMF remains unwrapped; HTTP function logs use message.*.
        LogFormat: Text
        LogGroup: !Ref ExportLogs
      Environment:
        Variables:
          APP_VERSION: !Ref BuildId
          TABLE: !Ref Table
          MAIL_BUCKET: !Ref MailBucket
          SECRET: !Ref RuntimeSecretName

  EventsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-events"
      RetentionInDays: 90

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # Content-free SNS idempotency receipt and the stop's activity
                # row with its live-profile proof, owned/deleted with the account.
                Action: [dynamodb:PutItem, dynamodb:ConditionCheckItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*"]
              - Effect: Allow
                # The scrubbed line for the ops queue.
                Action: sns:Publish
                Resource: !Ref AlarmTopic
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FailedQueue.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt EventsLogs.Arn

  EventsFunction:
    Type: AWS::Lambda::Function
    DependsOn: NativeSourcePolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-events"
      Description: Stops a subscriber's emails after a hard bounce or a complaint; tells ops without addresses
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      Code:
        S3Bucket: !Ref NativeSourceBucket
        S3Key: !Sub "native/workers/events/${EventsCode}.zip"
      Role: !GetAtt EventsRole.Arn
      MemorySize: 128
      Timeout: 30
      # A bounce or complaint that could not be applied, after Lambda's two
      # retries, waits here rather than being lost.
      DeadLetterConfig:
        TargetArn: !GetAtt FailedQueue.Arn
      LoggingConfig:
        # Event stdout JSON/EMF remains unwrapped; HTTP function logs use message.*.
        LogFormat: Text
        LogGroup: !Ref EventsLogs
      Environment:
        Variables:
          APP_VERSION: !Ref BuildId
          TABLE: !Ref Table
          ALARM_TOPIC: !Ref AlarmTopic

  EventsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: [EventsAliasInvokePermission, EventsAliasInvokeConfig]
    Properties:
      TopicArn: !Ref MailEventsTopic
      Protocol: lambda
      Endpoint: !Ref EventsAlias

  EventsAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref EventsFunction
      FunctionVersion: !GetAtt EventsNodeVersion.Version

  EventsAliasInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventsAlias
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref MailEventsTopic

  EventsAliasInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: EventsAlias
    Properties:
      FunctionName: !Ref EventsFunction
      Qualifier: live
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 21600

  # --- transcripts -------------------------------------------------------------
  # Recordings written out as text for subscribers who turn it on
  # (workers/transcribe.ts): the table's stream starts Amazon Transcribe jobs, and
  # each job's state change brings the words back to the note.

  TranscribeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-transcribe"
      RetentionInDays: 90

  TranscribeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: transcribe
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # Atomic live-profile proof and account-owned processing/commit state.
                Action: [dynamodb:ConditionCheckItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*"]
              - Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator]
                Resource: !GetAtt Table.StreamArn
              - Effect: Allow
                Action: dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                # Starting a job names no resource, so "*", but only with
                # its output in the mail bucket (workers/transcribe.ts's OutputBucketName).
                Action: transcribe:StartTranscriptionJob
                Resource: "*"
                Condition:
                  StringEquals:
                    transcribe:OutputBucketName: !Ref MailBucket
              - Effect: Allow
                # Only this product's jobs (transcribe.job_name's prefix).
                Action: transcribe:DeleteTranscriptionJob
                Resource: !Sub "arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/release-notes.*"
              - Effect: Allow
                # Transcribe reads the recording and writes its JSON as
                # this role.
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # S3 answers a read of a missing file 404 only to a role that
                # may list the bucket, and 403 to any other; a result gone
                # missing finishes empty on 404 and fails the job on 403.
                Action: s3:ListBucket
                Resource: !GetAtt MailBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub "${MailBucket.Arn}/transcripts/*"
              - Effect: Allow
                # Transcribe's empty test write before a job, should it go
                # to the top of the bucket rather than beside the output.
                Action: s3:PutObject
                Resource: !Sub "${MailBucket.Arn}/.write_access_check_file.temp"
              - Effect: Allow
                # Where a stream batch goes after its last retry.
                Action: sqs:SendMessage
                Resource: !GetAtt FailedQueue.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt TranscribeLogs.Arn

  TranscribeFunction:
    Type: AWS::Lambda::Function
    DependsOn: NativeSourcePolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-transcribe"
      Description: Writes out recordings as text for subscribers who turned it on
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      Code:
        S3Bucket: !Ref NativeSourceBucket
        S3Key: !Sub "native/workers/transcribe/${TranscribeCode}.zip"
      Role: !GetAtt TranscribeRole.Arn
      MemorySize: 256
      Timeout: 120
      # A ceiling on jobs started at once. A throttled stream batch waits
      # and is tried again (throttles do not use up its retries); a
      # throttled job event is an async event, tried for up to six hours.
      ReservedConcurrentExecutions: 2
      LoggingConfig:
        # Event stdout JSON/EMF remains unwrapped; HTTP function logs use message.*.
        LogFormat: Text
        LogGroup: !Ref TranscribeLogs
      Environment:
        Variables:
          APP_VERSION: !Ref BuildId
          TABLE: !Ref Table
          BUCKET: !Ref MailBucket

  TranscribeStream:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref TranscribeAlias
      EventSourceArn: !GetAtt Table.StreamArn
      StartingPosition: LATEST
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailedQueue.Arn
      BatchSize: 25
      MaximumRetryAttempts: 3
      BisectBatchOnFunctionError: true
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName": ["INSERT", "MODIFY"], "dynamodb": {"NewImage": {"sk": {"S": [{"prefix": "NOTE#"}]}}}}'
          - Pattern: '{"eventName": ["INSERT", "MODIFY"], "dynamodb": {"NewImage": {"sk": {"S": ["PROFILE"]}, "transcribe": {"BOOL": [true]}}}}'

  TranscribeDone:
    Type: AWS::Events::Rule
    DependsOn: TranscribeAliasDonePermission
    Properties:
      Description: A Release Notes transcription job finished
      EventPattern:
        source: [aws.transcribe]
        detail-type: [Transcribe Job State Change]
        detail:
          TranscriptionJobStatus: [COMPLETED, FAILED]
          TranscriptionJobName: [{ prefix: release-notes. }]
      State: ENABLED
      Targets:
        - Id: transcribe
          Arn: !Ref TranscribeAlias

  DescribeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-describe"
      RetentionInDays: 90

  DescribeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: describe
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # Scan: the one-off thumbnail pass over everyone, profiles' keys only.
                # PutItem: a past day's weather, kept again where a photo
                # says the day was (weather.keep_day). DeleteItem: that
                # day's weather for another place, when none can be had
                # for the photo's.
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:PutItem, dynamodb:DeleteItem,
                         dynamodb:Scan]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # Atomic live-profile proof and account-owned processing/commit state.
                Action: dynamodb:ConditionCheckItem
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*"]
              - Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator]
                Resource: !GetAtt Table.StreamArn
              - Effect: Allow
                Action: dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # S3 answers a read of a missing file 404 only to a role that
                # may list the bucket, and 403 to any other; a photo gone
                # missing is skipped on 404 and fails the batch on 403.
                Action: s3:ListBucket
                Resource: !GetAtt MailBucket.Arn
              - Effect: Allow
                # Each photo's thumbnail, beside it, and taking one back
                # when its note went meanwhile (packages/backend/thumbs.ts).
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${MailBucket.Arn}/media/*.thumb.jpg"
              - Effect: Allow
                # Thumbnail pending/kept tags, never originals.
                Action: s3:PutObjectTagging
                Resource: !Sub "${MailBucket.Arn}/media/*.thumb.jpg"
              - Effect: Allow
                # The runtime secret, for the Anthropic API key. It is kept
                # by hand outside the stack (its value never passes through
                # a template); the ?????? is the suffix Secrets Manager adds.
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${RuntimeSecretName}-??????"
              - Effect: Allow
                # Naming a photo's place by its neighbourhood, to keep
                # (places.namePhoto).
                Action: geo-places:ReverseGeocode
                Resource: !Sub "arn:${AWS::Partition}:geo-places:${AWS::Region}::provider/default"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-describe:live"
              - Effect: Allow
                # Where a stream batch goes after its last retry.
                Action: sqs:SendMessage
                Resource: !GetAtt FailedQueue.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DescribeLogs.Arn

  DescribeFunction:
    Type: AWS::Lambda::Function
    DependsOn: NativeSourcePolicy
    Properties:
      FunctionName: !Sub "${AWS::StackName}-describe"
      Description: Makes photo thumbnails, names notes' places from photos, and describes photos for subscribers who turned it on
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      Code:
        S3Bucket: !Ref NativeSourceBucket
        S3Key: !Sub "native/workers/describe/${DescribeCode}.zip"
      Role: !GetAtt DescribeRole.Arn
      # Decoding a phone's photo for its thumbnail; more memory is more CPU too.
      MemorySize: 1024
      Timeout: 900
      # A ceiling on photos going to the model at once: a pass and a stream
      # batch, say. A throttled stream batch waits and is tried again
      # (throttles do not use up its retries); a throttled next pass is an
      # async event, tried for up to six hours, carrying its chain (workers/describe.ts).
      ReservedConcurrentExecutions: 2
      LoggingConfig:
        # Event stdout JSON/EMF remains unwrapped; HTTP function logs use message.*.
        LogFormat: Text
        LogGroup: !Ref DescribeLogs
      Environment:
        Variables:
          APP_VERSION: !Ref BuildId
          TABLE: !Ref Table
          BUCKET: !Ref MailBucket
          SELF: !Sub "${AWS::StackName}-describe:live"
          SECRET: !Ref RuntimeSecretName

  DescribeStream:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn: DescribeAliasInvokeConfig
    Properties:
      FunctionName: !Ref DescribeAlias
      EventSourceArn: !GetAtt Table.StreamArn
      StartingPosition: LATEST
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailedQueue.Arn
      BatchSize: 5
      MaximumRetryAttempts: 3
      BisectBatchOnFunctionError: true
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName": ["INSERT", "MODIFY"], "dynamodb": {"NewImage": {"sk": {"S": [{"prefix": "NOTE#"}]}}}}'
          - Pattern: '{"eventName": ["INSERT", "MODIFY"], "dynamodb": {"NewImage": {"sk": {"S": ["PROFILE"]}, "describe": {"BOOL": [true]}}}}'

  # --- stable worker entry points: `live` serves the release ----------------

  SenderAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref SenderFunction
      FunctionVersion: !GetAtt SenderNodeVersion.Version

  InboundAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref InboundFunction
      FunctionVersion: !GetAtt InboundNodeVersion.Version

  TranscribeAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref TranscribeFunction
      FunctionVersion: !GetAtt TranscribeNodeVersion.Version

  DescribeAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref DescribeFunction
      FunctionVersion: !GetAtt DescribeNodeVersion.Version

  ExportAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref ExportFunction
      FunctionVersion: !GetAtt ExportNodeVersion.Version

  CaptureAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref CaptureFunction
      FunctionVersion: !GetAtt CaptureNodeVersion.Version

  InboundAliasInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InboundAlias
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${AWS::StackName}:receipt-rule/replies"

  SenderAliasSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SenderAlias
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !Ref SenderScheduleArn

  TranscribeAliasDonePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TranscribeAlias
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !Ref TranscribeDoneArn

  # Three tries (workers/inbound.ts ATTEMPTS), then Lambda's failure record
  # (the SES event) goes to the inbound failed queue. A failure the code caught
  # already shows as failed in the owner's activity log, with a notice; a
  # timeout or crash gets both there (workers/inbound.ts gaveUp).
  InboundAliasInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    # Lambda checks the role may send to the queue when the destination is set.
    DependsOn: [InboundAlias, InboundRole]
    Properties:
      FunctionName: !Ref InboundFunction
      Qualifier: live
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 21600
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt InboundFailedQueue.Arn

  # Inbound reads its own failure records one at a time, logs each and hands
  # it on to the failed queue unchanged. Three failed reads hand it on unread.
  InboundFailedSource:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn: InboundRole
    Properties:
      FunctionName: !Ref InboundAlias
      EventSourceArn: !GetAtt InboundFailedQueue.Arn
      BatchSize: 1

  ExportAliasInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: ExportAlias
    Properties:
      FunctionName: !Ref ExportFunction
      Qualifier: live
      MaximumRetryAttempts: 0

  DescribeAliasInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: DescribeAlias
    Properties:
      FunctionName: !Ref DescribeFunction
      Qualifier: live
      MaximumRetryAttempts: 2

  # Each release publishes a new version of every worker (its Description is
  # the build) after the function's update, which the FunctionName Ref
  # orders, so `live` serves the release's code and configuration together.
  # The version it replaced is deleted once the update succeeds.
  SenderNodeVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref SenderFunction
      Description: !Ref BuildId

  InboundNodeVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref InboundFunction
      Description: !Ref BuildId

  EventsNodeVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref EventsFunction
      Description: !Ref BuildId

  TranscribeNodeVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref TranscribeFunction
      Description: !Ref BuildId

  DescribeNodeVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref DescribeFunction
      Description: !Ref BuildId

  ExportNodeVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref ExportFunction
      Description: !Ref BuildId

  CaptureNodeVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref CaptureFunction
      Description: !Ref BuildId

  # --- alarms -----------------------------------------------------------------

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudWatchAlarms
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlarmQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: sqs
      Endpoint: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${OpsQueueName}"
      RawMessageDelivery: true

  # What would otherwise be dropped after its retries: a bounce or complaint
  # event the events function could not apply (the SNS message, which names
  # the address, so it stays here and never goes to the ops queue), an
  # inbound email inbound gave up on (the SES event: addresses and subject,
  # never the body, which stays in raw/), and a stream batch the transcriber
  # or describer gave up on (the shard and sequence numbers only, no note
  # text). Kept 14 days. Read it, fix the cause, and apply or replay by hand:
  # an inbound event replays by invoking the inbound function's live alias
  # with {"Records": [<the record>]}.
  FailedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-failed"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # Inbound's failure records on their way to the failed queue (InboundFailedSource).
  # Visible again after six times the function's timeout, as Lambda advises.
  InboundFailedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-inbound-failed"
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 360
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FailedQueue.Arn
        maxReceiveCount: 3

  # Normally read within seconds; one waiting a quarter hour means inbound
  # is not reading it, and the failed queue's own alarm would never fire.
  InboundFailedQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-inbound-failed-queue"
      AlarmDescription: An email inbound gave up on has waited a quarter hour to be logged and handed on to the failed queue.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{ Name: QueueName, Value: !GetAtt InboundFailedQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  FailedQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-failed-queue"
      AlarmDescription: Something gave up after its retries and is waiting in the failed queue. A bounce may not have stopped its subscriber.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt FailedQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  SenderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-sender-errors"
      AlarmDescription: The daily sender failed. Someone may not have had today's email.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref SenderFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  McpErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-mcp-errors"
      AlarmDescription: Delegated MCP capture and count-only tool failures
      Metrics:
        - Id: failures
          Expression: SUM(METRICS())
          ReturnData: true
        - Id: writer
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref CaptureFunction }]
            Stat: Sum
            Period: 300
        - Id: tools
          ReturnData: false
          MetricStat:
            Metric: { Namespace: ReleaseNotes, MetricName: McpFailures }
            Stat: Sum
            Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  SignInTotalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-signin-total"
      AlarmDescription: The hour's sign-in emails for everyone are used up. Nobody can sign in until the hour turns; someone may be sending from many networks.
      Namespace: ReleaseNotes
      MetricName: SignInTotalLimited
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  EventsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-events-errors"
      AlarmDescription: A bounce or complaint could not be applied to its subscriber.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref EventsFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ExportErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-export-errors"
      AlarmDescription: A zip export or a book failed to build. The page says so and offers to try again.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ExportFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  TranscribeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-transcribe-errors"
      AlarmDescription: A recording's transcript could not be started or kept. The recording itself is safe.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref TranscribeFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DescribeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-describe-errors"
      AlarmDescription: A photo's description could not be made or kept. The photo itself is safe.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref DescribeFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  InboundErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-inbound-errors"
      AlarmDescription: A reply failed to file. The raw message is still in the mail bucket.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref InboundFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Anyone's email overdue: their send time was over half an hour ago and
  # nothing went (packages/backend/census.ts). A count from the sender's census line.
  OverdueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-overdue"
      AlarmDescription: Someone's daily email is over half an hour late. The sender may be failing, or a send time moved past today's window.
      Namespace: ReleaseNotes
      MetricName: Overdue
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The operations dashboard (Jamie, 2026-10-09). Counts only: no address,
  # no user id, no note text. Behind AWS sign-in, so nothing in the web app.
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref AWS::StackName
      DashboardBody: !Sub |
        {
          "start": "-P14D",
          "periodOverride": "inherit",
          "widgets": [
            {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {
              "markdown": "# Release Notes\nCounts only: no addresses, no note text. Subscribers, notes and writers come from the sender's census line every quarter hour (`packages/backend/census.ts`); emails from SES; mail in and account events from the functions' logs, kept 90 days. One row per person: `tools/subscribers.ts`."}},
            {"type": "alarm", "x": 0, "y": 2, "width": 24, "height": 3, "properties": {
              "title": "Alarms",
              "alarms": ["${SenderErrorsAlarm.Arn}", "${OverdueAlarm.Arn}", "${InboundErrorsAlarm.Arn}", "${EventsErrorsAlarm.Arn}", "${McpErrorsAlarm.Arn}", "${ExportErrorsAlarm.Arn}", "${FailedQueueAlarm.Arn}", "${InboundFailedQueueAlarm.Arn}", "${NativeAppErrorsAlarm.Arn}", "${NativeMcpErrorsAlarm.Arn}", "${NativeAppCapacityAlarm.Arn}", "${NativeMcpCapacityAlarm.Arn}", "${NativeAppRateAlarm.Arn}", "${NativeMcpRateAlarm.Arn}", "${TranscribeErrorsAlarm.Arn}", "${DescribeErrorsAlarm.Arn}", "${SignInTotalAlarm.Arn}"]}},
            {"type": "metric", "x": 0, "y": 5, "width": 24, "height": 4, "properties": {
              "title": "Right now", "view": "singleValue", "region": "${AWS::Region}",
              "period": 900, "stat": "Maximum", "setPeriodToTimeRange": false, "sparkline": true,
              "metrics": [
                ["ReleaseNotes", "Subscribers", {"label": "Getting the email"}],
                ["ReleaseNotes", "Paused", {"label": "Paused"}],
                ["ReleaseNotes", "Stopped", {"label": "Stopped"}],
                ["ReleaseNotes", "Overdue", {"label": "Email overdue"}],
                ["ReleaseNotes", "Notes", {"label": "Notes"}],
                ["ReleaseNotes", "Writers7", {"label": "Wrote this week"}],
                ["ReleaseNotes", "ReplyRate30", {"label": "Reply rate, 30 days (%)"}]
              ]}},
            {"type": "metric", "x": 0, "y": 9, "width": 12, "height": 6, "properties": {
              "title": "Emails a day, by kind (SES)", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 86400, "stat": "Sum",
              "metrics": [
                [{"expression": "SEARCH('{AWS/SES,\"release-notes-mail\"}', 'Sum', 86400)", "id": "mail"}]
              ]}},
            {"type": "metric", "x": 12, "y": 9, "width": 12, "height": 6, "properties": {
              "title": "SES account reputation", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 3600, "stat": "Maximum",
              "metrics": [
                ["AWS/SES", "Reputation.BounceRate", {"label": "Bounce rate"}],
                ["AWS/SES", "Reputation.ComplaintRate", {"label": "Complaint rate", "yAxis": "right"}]
              ],
              "annotations": {"horizontal": [
                {"value": 0.05, "label": "Bounces: AWS reviews at 5%"},
                {"value": 0.001, "label": "Complaints: AWS reviews at 0.1%", "yAxis": "right"}
              ]}}},
            {"type": "metric", "x": 0, "y": 15, "width": 12, "height": 6, "properties": {
              "title": "Notes, by where they came from", "view": "timeSeries", "stacked": true, "region": "${AWS::Region}",
              "period": 3600, "stat": "Maximum",
              "metrics": [
                ["ReleaseNotes", "EmailNotes", {"label": "By email"}],
                ["ReleaseNotes", "WebNotes", {"label": "On the web"}],
                ["ReleaseNotes", "ImportedNotes", {"label": "Imported"}],
                ["ReleaseNotes", "AgentNotes", {"label": "Added by agents"}],
                ["ReleaseNotes", "ApiNotes", {"label": "Through API tokens"}]
              ]}},
            {"type": "metric", "x": 12, "y": 15, "width": 12, "height": 6, "properties": {
              "title": "Subscribers and writers", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 3600, "stat": "Maximum",
              "metrics": [
                ["ReleaseNotes", "Subscribers", {"label": "Getting the email"}],
                ["ReleaseNotes", "Writers7", {"label": "Wrote in the last 7 days"}],
                ["ReleaseNotes", "Writers30", {"label": "Wrote in the last 30 days"}],
                ["ReleaseNotes", "ReplyRate30", {"label": "Reply rate, 30 days (%)", "yAxis": "right"}]
              ]}},
            {"type": "log", "x": 0, "y": 21, "width": 12, "height": 6, "properties": {
              "title": "Mail in: filed or ignored, and why", "view": "table", "region": "${AWS::Region}",
              "query": "SOURCE '${InboundLogs}' | filter event = 'inbound' | stats count(*) as messages by outcome, reason | sort messages desc"}},
            {"type": "log", "x": 12, "y": 21, "width": 12, "height": 6, "properties": {
              "title": "Accounts: sign-ups, stops and sign-ins", "view": "table", "region": "${AWS::Region}",
              "query": "SOURCE '${NativeAppLogs}' | SOURCE '${EventsLogs}' | fields coalesce(event, message.event) as kind, coalesce(reason, message.reason) as why | filter kind in ['signup', 'signin-sent', 'unsubscribe', 'pause', 'resume', 'account-deleted'] or (kind = 'mail-event' and outcome = 'stopped') | stats count(*) as times by kind, why | sort times desc"}},
            {"type": "metric", "x": 0, "y": 27, "width": 16, "height": 6, "properties": {
              "title": "Function errors", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 3600, "stat": "Sum",
              "metrics": [
                ["AWS/Lambda", "Errors", "FunctionName", "${SenderFunction}", {"label": "sender"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${InboundFunction}", {"label": "inbound"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${CaptureFunction}", {"label": "capture"}],
                ["ReleaseNotes", "McpFailures", {"label": "MCP tool failures"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${EventsFunction}", {"label": "events"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${ExportFunction}", {"label": "export"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${TranscribeFunction}", {"label": "transcribe"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${DescribeFunction}", {"label": "describe"}]
              ]}},
            {"type": "metric", "x": 16, "y": 27, "width": 8, "height": 6, "properties": {
              "title": "Mail bucket size (emails, photos, exports)", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 86400, "stat": "Average",
              "metrics": [
                ["AWS/S3", "BucketSizeBytes", "BucketName", "${MailBucket}", "StorageType", "StandardStorage", {"label": "bytes"}]
              ]}},
            {"type": "log", "x": 0, "y": 33, "width": 24, "height": 7, "properties": {
              "title": "Recent problems", "view": "table", "region": "${AWS::Region}",
              "query": "SOURCE '${SenderLogs}' | SOURCE '${InboundLogs}' | SOURCE '${EventsLogs}' | SOURCE '${ExportLogs}' | SOURCE '${NativeAppLogs}' | SOURCE '${NativeMcpLogs}' | fields coalesce(event, message.event) as kind, coalesce(status, message.status) as responseStatus | filter (ispresent(kind) and (kind like /error|failed|out-of-time|census-skipped/ or responseStatus >= 500)) or (not ispresent(kind) and @message like /ERROR|Task timed out/) | fields @timestamp, @log, coalesce(kind, @message) as what, coalesce(error, message.error) as errorKind, coalesce(code, message.code) as errorCode, responseStatus | sort @timestamp desc | limit 25"}},
            {"type": "metric", "x": 0, "y": 40, "width": 12, "height": 6, "properties": {
              "title": "Native app HTTP", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 300, "stat": "Sum", "metrics": [
                ["AWS/Lambda/Web", "ExecutedRequests", "FunctionName", "${AWS::StackName}-web-native", "EndpointName", "live", {"label": "requests"}],
                ["AWS/Lambda/Web", "HTTPResponseStatusClass4XX", "FunctionName", "${AWS::StackName}-web-native", "EndpointName", "live", {"label": "4xx"}],
                ["AWS/Lambda/Web", "HTTPResponseStatusClass5XX", "FunctionName", "${AWS::StackName}-web-native", "EndpointName", "live", {"label": "5xx"}],
                ["AWS/Lambda/Web/Usage", "EndpointActiveEnvironmentThrottles", "FunctionName", "${AWS::StackName}-web-native", "EndpointName", "live", "ExecutionRegion", "${AWS::Region}", {"label": "environment throttles"}],
                ["AWS/Lambda/Web/Usage", "EndpointRequestThrottles", "FunctionName", "${AWS::StackName}-web-native", "EndpointName", "live", "ExecutionRegion", "${AWS::Region}", {"label": "rate throttles"}]
              ]}},
            {"type": "metric", "x": 12, "y": 40, "width": 12, "height": 6, "properties": {
              "title": "Native MCP HTTP", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 300, "stat": "Sum", "metrics": [
                ["AWS/Lambda/Web", "ExecutedRequests", "FunctionName", "${AWS::StackName}-mcp-native", "EndpointName", "live", {"label": "requests"}],
                ["AWS/Lambda/Web", "HTTPResponseStatusClass4XX", "FunctionName", "${AWS::StackName}-mcp-native", "EndpointName", "live", {"label": "4xx"}],
                ["AWS/Lambda/Web", "HTTPResponseStatusClass5XX", "FunctionName", "${AWS::StackName}-mcp-native", "EndpointName", "live", {"label": "5xx"}],
                ["AWS/Lambda/Web/Usage", "EndpointActiveEnvironmentThrottles", "FunctionName", "${AWS::StackName}-mcp-native", "EndpointName", "live", "ExecutionRegion", "${AWS::Region}", {"label": "environment throttles"}],
                ["AWS/Lambda/Web/Usage", "EndpointRequestThrottles", "FunctionName", "${AWS::StackName}-mcp-native", "EndpointName", "live", "ExecutionRegion", "${AWS::Region}", {"label": "rate throttles"}]
              ]}}
          ]
        }

Outputs:
  SenderLiveVersion:
    Value: !GetAtt SenderNodeVersion.Version
  InboundLiveVersion:
    Value: !GetAtt InboundNodeVersion.Version
  EventsLiveVersion:
