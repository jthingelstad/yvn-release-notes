AWSTemplateFormatVersion: "2010-09-09"
Description: Release Notes for Your Version Number - a daily version-number email whose replies are kept as notes

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  PillowLayerKey:
    Type: String
    Description: The Pillow layer's zip in the code bucket (deploy.sh builds it from layers/pillow.txt). Only the describe function, which makes thumbnails (thumbs.py), uses it.
  Domain:
    Type: String
    Default: yourversionnumber.com
  InboundDomain:
    Type: String
    Default: in.yourversionnumber.com
    Description: MX points at SES; every reply address lives here.
  MailFromDomain:
    Type: String
    Default: bounce.yourversionnumber.com
  FromAddress:
    Type: String
    Default: notes@yourversionnumber.com
  OpsQueueName:
    Type: String
    Default: projects-ops-alerts
    Description: The account's alerts queue. Its policy must list this stack's alarm topic.
  WebDomain:
    Type: String
    Default: notes.yourversionnumber.com
  WebCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: ^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$
    Description: The us-east-1 ACM certificate for WebDomain, issued outside the stack (as Drop's is). deploy.sh passes it once ACM says ISSUED; until then the distribution answers on its cloudfront.net name only.

  AnthropicSecretName:
    Type: String
    Default: yvn-release-notes-anthropic
    Description: The Secrets Manager secret holding api_key, the Anthropic API key photo descriptions use. Made by hand; the describer sends nothing while it holds the placeholder.

  SenderScheduleArn:
    Type: String
    AllowedPattern: ^arn:[^:]+:events:[^:]+:[0-9]{12}:rule/.+$
    Description: Existing sender rule ARN, read from control-plane metadata; avoids a permission/target dependency cycle without replacing the rule.
  TranscribeDoneArn:
    Type: String
    AllowedPattern: ^arn:[^:]+:events:[^:]+:[0-9]{12}:rule/.+$
    Description: Existing transcription-completion rule ARN, read from control-plane metadata; the rule itself keeps its physical name.

  WorkerAliasesReady:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: First deploy false to publish worker aliases and permissions; then true to publish the final describe self-invoke configuration and move existing targets.

  EventsPythonCodeSha256:
    Type: String
    AllowedPattern: '^[A-Za-z0-9+/]{43}=$'
    Description: SHA-256 base64 of the first complete idempotent Python bridge zip; keep this exact value on every later release so the retained baseline is never republished.
  EventsAliasesReady:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: First deploy false; verify both published Python bridge and unqualified handler/hash before retargeting SNS in a second deploy with true.

  NativeWebFunctionsEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: Add private Node 24 HTTP compute after the separately created source bucket receives immutable, versioned artifacts.
  NativeHttpRouting:
    Type: String
    Default: legacy
    AllowedValues: [legacy, native]
    Description: Change only after tools/web-platform.ts has installed and verified both complete CloudFront endpoint policies.
  NativeOriginPoliciesReady:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: Explicit release receipt gate; CloudFormation cannot own Web Function policies with the current registry schema.
  NativeAppCodeKey:
    Type: String
    Default: ""
    AllowedPattern: '^$|^native/app/[a-f0-9]{64}\.zip$'
  NativeAppCodeVersion:
    Type: String
    Default: ""
  NativeAppBuildId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-f0-9]{40,64}$'
  NativeMcpCodeKey:
    Type: String
    Default: ""
    AllowedPattern: '^$|^native/mcp/[a-f0-9]{64}\.zip$'
  NativeMcpCodeVersion:
    Type: String
    Default: ""
  NativeMcpBuildId:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[a-f0-9]{40,64}$'
  NativeAppLiveRevisionId:
    Type: String
    Default: ""
    Description: Pin the current live revision before publishing another artifact; empty is for first creation only.
  NativeAppRollbackRevisionId:
    Type: String
    Default: ""
    Description: Protected last-good revision reference; the zero-rate endpoint prevents service cleanup of this revision.
  NativeMcpLiveRevisionId:
    Type: String
    Default: ""
    Description: Pin the current live revision before publishing another artifact; empty is for first creation only.
  NativeMcpRollbackRevisionId:
    Type: String
    Default: ""
    Description: Protected last-good revision reference; the zero-rate endpoint prevents service cleanup of this revision.
  NativeMaxEnvironments:
    Type: Number
    Default: 8
    MinValue: 2
    MaxValue: 8
    Description: Initial budget ceiling per live endpoint; actual admission concurrency is chosen by the service.
  NativeMaxConcurrency:
    Type: Number
    Default: 64
    MinValue: 1
    MaxValue: 64
    Description: Upper bound per environment, not a guaranteed admission capacity.

Rules:
  NativeArtifactsRequired:
    RuleCondition: !Equals [!Ref NativeWebFunctionsEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref WorkerAliasesReady, "true"]
        AssertDescription: Stable worker aliases must be activated before native HTTP compute is created.
      - Assert: !Not [!Equals [!Ref NativeAppCodeKey, ""]]
        AssertDescription: NativeAppCodeKey must identify the immutable uploaded artifact.
      - Assert: !Not [!Equals [!Ref NativeAppCodeVersion, ""]]
        AssertDescription: NativeAppCodeVersion must identify the immutable uploaded artifact.
      - Assert: !Not [!Equals [!Ref NativeAppBuildId, ""]]
        AssertDescription: NativeAppBuildId must identify the immutable uploaded artifact.
      - Assert: !Not [!Equals [!Ref NativeMcpCodeKey, ""]]
        AssertDescription: NativeMcpCodeKey must identify the immutable uploaded artifact.
      - Assert: !Not [!Equals [!Ref NativeMcpCodeVersion, ""]]
        AssertDescription: NativeMcpCodeVersion must identify the immutable uploaded artifact.
      - Assert: !Not [!Equals [!Ref NativeMcpBuildId, ""]]
        AssertDescription: NativeMcpBuildId must identify the immutable uploaded artifact.
  NativeRoutingRequiresVerifiedPolicies:
    RuleCondition: !Equals [!Ref NativeHttpRouting, native]
    Assertions:
      - Assert: !Equals [!Ref NativeWebFunctionsEnabled, "true"]
        AssertDescription: Native HTTP routing requires native compute.
      - Assert: !Equals [!Ref NativeOriginPoliciesReady, "true"]
        AssertDescription: Install and read back both endpoint resource policies before moving CloudFront origins.

Conditions:
  UseEventsAlias: !Equals [!Ref EventsAliasesReady, "true"]
  CreateNativeHttp: !Equals [!Ref NativeWebFunctionsEnabled, "true"]
  RouteNativeHttp: !Equals [!Ref NativeHttpRouting, native]
  HasNativeAppLiveRevision: !Not [!Equals [!Ref NativeAppLiveRevisionId, ""]]
  HasNativeAppRollbackRevision: !Not [!Equals [!Ref NativeAppRollbackRevisionId, ""]]
  HasNativeMcpLiveRevision: !Not [!Equals [!Ref NativeMcpLiveRevisionId, ""]]
  HasNativeMcpRollbackRevision: !Not [!Equals [!Ref NativeMcpRollbackRevisionId, ""]]
  UseWorkerAliases: !Equals [!Ref WorkerAliasesReady, "true"]
  HasWebCertificate: !Not [!Equals [!Ref WebCertificateArn, ""]]

Resources:
  # Native source objects must outlive EVERY active/rollback revision. No
  # lifecycle expiration here: deleting a source version permanently fails
  # its revision, even if that version is subsequently restored. Retained
  # revisions alone are insufficient: the service cleans up unused revisions;
  # the separate zero-rate rollback endpoints below keep last-good references.
  NativeSourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  NativeSourcePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref NativeSourceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaReadsOnlyNativeRevisions
            Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub "${NativeSourceBucket.Arn}/native/*"
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
              ArnLike:
                aws:SourceArn:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${AWS::StackName}-web-native/*"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:web-function/${AWS::StackName}-mcp-native/*"
          - Sid: TLSOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt NativeSourceBucket.Arn, !Sub "${NativeSourceBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # These groups are created before compute. Console.info(object) is wrapped
  # under message by Web Functions; Event Functions keep their raw JSON logs.
  NativeAppLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda-web/${AWS::StackName}-web-native"
      RetentionInDays: 90

  NativeAppLocalLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda-web/${AWS::StackName}-web-native.local"
      RetentionInDays: 90

  NativeMcpLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda-web/${AWS::StackName}-mcp-native"
      RetentionInDays: 14

  NativeMcpLocalLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda-web/${AWS::StackName}-mcp-native.local"
      RetentionInDays: 14

  NativeOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-native"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always-amz-auth
        SigningProtocol: sigv4

  # CloudFront rejects forwarding Authorization with MaxTTL=0. Min/default=0
  # and a one-second maximum permit forwarding it. EVERY native response,
  # including errors, must set Cache-Control: no-store (central middleware).
  NativeHttpCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-native-http"
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  NativeHttpRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-native-http"
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Origin, Content-Type, Accept, CloudFront-Viewer-Address, MCP-Protocol-Version, Mcp-Session-Id, Last-Event-ID]
        CookiesConfig:
          CookieBehavior: whitelist
          Cookies: [__Host-rn]
        QueryStringsConfig: { QueryStringBehavior: all }

  # Resource policies have one owner: tools/web-platform.ts. The current
  # AWS::Lambda::ResourcePolicy registry schema excludes web-function ARNs.
  # The release installs exact distribution/live-endpoint permissions, reads
  # them back, and records its CAS revision before NativeHttpRouting=native.
  NativeAppFunction:
    Type: AWS::Lambda::WebFunction
    Condition: CreateNativeHttp
    Properties:
      FunctionName: !Sub "${AWS::StackName}-web-native"

  NativeAppRevision:
    Type: AWS::Lambda::WebFunctionRevision
    # cfn-lint cannot propagate Rules' nonempty assertions into Conditions.
    Metadata:
      cfn-lint:
        config: { ignore_checks: [W1030] }
    Condition: CreateNativeHttp
    DependsOn: [NativeAppFunction, NativeSourcePolicy]
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # The provider normalizes ARN inputs to names; using an ARN breaks its
      # later read/rollback. Depend on the function, pass its bare name.
      FunctionName: !Sub "${AWS::StackName}-web-native"
      Description: !Ref NativeAppBuildId
      BuildConfig:
        CodeConfig:
          S3Object:
            Bucket: !Ref NativeSourceBucket
            Key: !Ref NativeAppCodeKey
            VersionId: !Ref NativeAppCodeVersion
        RuntimeConfig: { Runtime: nodejs24.x }
      ServiceConfig:
        ExecutionRoleArn: !GetAtt WebRole.Arn
        TimeoutSeconds: 28
        MaxConcurrencyPerEnvironment: !Ref NativeMaxConcurrency
        EnvironmentVariables:
          TABLE: !Ref Table
          MAIL_BUCKET: !Ref MailBucket
          WEB_ORIGIN: !Sub "https://${WebDomain}"
          APP_VERSION: !Ref NativeAppBuildId
          FROM_ADDRESS: !Ref FromAddress
          CONFIG_SET: !Ref ConfigurationSet
          INBOUND_DOMAIN: !Ref InboundDomain
          SENDER_FUNCTION: !Ref SenderAlias
          EXPORT_FUNCTION: !Ref ExportAlias
        TelemetryConfig:
          LoggingConfig:
            LogGroup: !Ref NativeAppLogs
            ApplicationLogLevel: INFO
            SystemLogLevel: INFO

  NativeAppLiveEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Condition: CreateNativeHttp
    DependsOn: NativeAppFunction
    Properties:
      FunctionName: !Sub "${AWS::StackName}-web-native"
      EndpointName: live
      EndpointType: HomeRegion
      AuthType: IamAuth
      # Explicit weights imply Disabled auto-deployment (verified on AWS).
      # Pin both IDs before another artifact/revision is published; otherwise
      # an empty initial parameter follows the newly created revision.
      RevisionWeights:
        - RevisionId: !If [HasNativeAppLiveRevision, !Ref NativeAppLiveRevisionId, !GetAtt NativeAppRevision.RevisionId]
          Weight: 100
      ScalingConfig:
        MaxEnvironments: !Ref NativeMaxEnvironments
      ThrottleConfig: { RateLimit: 100 }

  NativeAppRollbackEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Condition: CreateNativeHttp
    DependsOn: NativeAppFunction
    Properties:
      FunctionName: !Sub "${AWS::StackName}-web-native"
      EndpointName: rollback
      EndpointType: HomeRegion
      AuthType: IamAuth
      # Explicit weights imply Disabled auto-deployment (verified on AWS).
      # Pin both IDs before another artifact/revision is published; otherwise
      # an empty initial parameter follows the newly created revision.
      RevisionWeights:
        - RevisionId: !If [HasNativeAppRollbackRevision, !Ref NativeAppRollbackRevisionId, !GetAtt NativeAppRevision.RevisionId]
          Weight: 100
      ScalingConfig:
        MaxEnvironments: 2
      ThrottleConfig: { RateLimit: 0 }

  NativeMcpFunction:
    Type: AWS::Lambda::WebFunction
    Condition: CreateNativeHttp
    Properties:
      FunctionName: !Sub "${AWS::StackName}-mcp-native"

  NativeMcpRevision:
    Type: AWS::Lambda::WebFunctionRevision
    # cfn-lint cannot propagate Rules' nonempty assertions into Conditions.
    Metadata:
      cfn-lint:
        config: { ignore_checks: [W1030] }
    Condition: CreateNativeHttp
    DependsOn: [NativeMcpFunction, NativeSourcePolicy]
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # The provider normalizes ARN inputs to names; using an ARN breaks its
      # later read/rollback. Depend on the function, pass its bare name.
      FunctionName: !Sub "${AWS::StackName}-mcp-native"
      Description: !Ref NativeMcpBuildId
      BuildConfig:
        CodeConfig:
          S3Object:
            Bucket: !Ref NativeSourceBucket
            Key: !Ref NativeMcpCodeKey
            VersionId: !Ref NativeMcpCodeVersion
        RuntimeConfig: { Runtime: nodejs24.x }
      ServiceConfig:
        ExecutionRoleArn: !GetAtt McpRole.Arn
        TimeoutSeconds: 28
        MaxConcurrencyPerEnvironment: !Ref NativeMaxConcurrency
        EnvironmentVariables:
          TABLE: !Ref Table
          MAIL_BUCKET: !Ref MailBucket
          WEB_ORIGIN: !Sub "https://${WebDomain}"
          APP_VERSION: !Ref NativeMcpBuildId
          CAPTURE_FUNCTION: !Ref CaptureAlias
        TelemetryConfig:
          LoggingConfig:
            LogGroup: !Ref NativeMcpLogs
            ApplicationLogLevel: INFO
            SystemLogLevel: INFO

  NativeMcpLiveEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Condition: CreateNativeHttp
    DependsOn: NativeMcpFunction
    Properties:
      FunctionName: !Sub "${AWS::StackName}-mcp-native"
      EndpointName: live
      EndpointType: HomeRegion
      AuthType: IamAuth
      # Explicit weights imply Disabled auto-deployment (verified on AWS).
      # Pin both IDs before another artifact/revision is published; otherwise
      # an empty initial parameter follows the newly created revision.
      RevisionWeights:
        - RevisionId: !If [HasNativeMcpLiveRevision, !Ref NativeMcpLiveRevisionId, !GetAtt NativeMcpRevision.RevisionId]
          Weight: 100
      ScalingConfig:
        MaxEnvironments: !Ref NativeMaxEnvironments
      ThrottleConfig: { RateLimit: 100 }

  NativeMcpRollbackEndpoint:
    Type: AWS::Lambda::WebFunctionEndpoint
    Condition: CreateNativeHttp
    DependsOn: NativeMcpFunction
    Properties:
      FunctionName: !Sub "${AWS::StackName}-mcp-native"
      EndpointName: rollback
      EndpointType: HomeRegion
      AuthType: IamAuth
      # Explicit weights imply Disabled auto-deployment (verified on AWS).
      # Pin both IDs before another artifact/revision is published; otherwise
      # an empty initial parameter follows the newly created revision.
      RevisionWeights:
        - RevisionId: !If [HasNativeMcpRollbackRevision, !Ref NativeMcpRollbackRevisionId, !GetAtt NativeMcpRevision.RevisionId]
          Weight: 100
      ScalingConfig:
        MaxEnvironments: 2
      ThrottleConfig: { RateLimit: 0 }

  NativeSignInTotalMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NativeAppLogs
      FilterPattern: '{ $.message.event = "mail-limited" && $.message.limit = "total" }'
      MetricTransformations:
        - MetricNamespace: ReleaseNotes
          MetricName: SignInTotalLimited
          MetricValue: "1"

  NativeMcpFailuresMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref NativeMcpLogs
      FilterPattern: '{ $.message.event = "mcp-error" }'
      MetricTransformations:
        - MetricNamespace: ReleaseNotes
          MetricName: McpFailures
          MetricValue: "1"

  NativeAppErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-web-native-errors"
      AlarmDescription: Native web endpoint returned a server error; counts only.
      Namespace: AWS/Lambda/Web
      MetricName: HTTPResponseStatusClass5XX
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-web-native" }
        - { Name: EndpointName, Value: live }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NativeAppCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-web-native-capacity"
      AlarmDescription: Native web endpoint refused a request at its environment ceiling; counts only.
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointActiveEnvironmentThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-web-native" }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NativeAppRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-web-native-rate"
      AlarmDescription: Native web endpoint refused a request at its rate ceiling; counts only.
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointRequestThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-web-native" }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NativeMcpErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-mcp-native-errors"
      AlarmDescription: Native mcp endpoint returned a server error; counts only.
      Namespace: AWS/Lambda/Web
      MetricName: HTTPResponseStatusClass5XX
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-mcp-native" }
        - { Name: EndpointName, Value: live }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NativeMcpCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-mcp-native-capacity"
      AlarmDescription: Native mcp endpoint refused a request at its environment ceiling; counts only.
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointActiveEnvironmentThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-mcp-native" }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  NativeMcpRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-mcp-native-rate"
      AlarmDescription: Native mcp endpoint refused a request at its rate ceiling; counts only.
      Namespace: AWS/Lambda/Web/Usage
      MetricName: EndpointRequestThrottles
      Dimensions:
        - { Name: FunctionName, Value: !Sub "${AWS::StackName}-mcp-native" }
        - { Name: EndpointName, Value: live }
        - { Name: ExecutionRegion, Value: !Ref AWS::Region }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # --- storage ------------------------------------------------------------

  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref AWS::StackName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      # Sign-in links, sessions and rate-limit counters carry expires_at
      # (epoch seconds) and clear themselves. Nothing kept for good sets it.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      # Read by the transcriber only: a note with a recording, or the
      # setting just turned on (transcribe.py).
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # Raw inbound mail under raw/. Filed replies are kept; their photos and
  # recordings are copied to media/ (media.py) and kept too. Ignored mail
  # expires, and so do zip exports (exports/, offered for a day).
  MailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-mail-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      # The web app sends files straight here, with a form web.start_upload
      # signs (media.py); the page must be able to read S3's answer.
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Sub "https://${WebDomain}"]
            AllowedMethods: [POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: expire-pending-uploads
            # A file sent from the web that no note took within a day.
            Status: Enabled
            TagFilters:
              - { Key: outcome, Value: pending }
            ExpirationInDays: 1
          - Id: expire-ignored-mail
            Status: Enabled
            TagFilters:
              - { Key: outcome, Value: ignored }
            ExpirationInDays: 30
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: expire-transcripts
            # A finished job's JSON, which the transcriber deletes once the
            # words are on the note; any it missed go here.
            Status: Enabled
            Prefix: transcripts/
            ExpirationInDays: 2
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: expire-exports
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 2
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SesWritesInboundMail
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${MailBucket.Arn}/raw/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${AWS::StackName}:receipt-rule/*"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt MailBucket.Arn
              - !Sub "${MailBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # --- sending --------------------------------------------------------------

  ConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Ref AWS::StackName
      ReputationOptions:
        ReputationMetricsEnabled: true
      SuppressionOptions:
        SuppressedReasons: [BOUNCE, COMPLAINT]

  # Delivery problems go to the events function only (events.py): SES's
  # event carries the address, the subject (a sign-in code) and the reply
  # token, so it never goes to the ops queue as is. The function sends the
  # queue a line with the kind and the user id. No open or click events.
  ConfigurationSetEvents:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: mail-events
        Enabled: true
        MatchingEventTypes: [bounce, complaint, reject, renderingFailure, deliveryDelay]
        SnsDestination:
          TopicARN: !Ref MailEventsTopic

  # Every email counted in CloudWatch for the dashboard, by its kind (the
  # release-notes-mail tag: daily or account). Counts only; still no open
  # or click events.
  ConfigurationSetMetrics:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: mail-metrics
        Enabled: true
        MatchingEventTypes: [send, delivery, bounce, complaint, reject]
        CloudWatchDestination:
          DimensionConfigurations:
            - DimensionName: release-notes-mail
              DimensionValueSource: messageTag
              DefaultDimensionValue: other

  MailEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-mail-events"

  MailEventsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref MailEventsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SesEvents
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref MailEventsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref Domain
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref ConfigurationSet
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      MailFromAttributes:
        MailFromDomain: !Ref MailFromDomain
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  # --- receiving ------------------------------------------------------------

  ReceiptRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: !Ref AWS::StackName

  ReceiptRule:
    Type: AWS::SES::ReceiptRule
    DependsOn: [MailBucketPolicy, InboundInvokePermission, InboundAliasInvokePermission]
    Properties:
      RuleSetName: !Ref ReceiptRuleSet
      Rule:
        Name: replies
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Optional
        Recipients: [!Ref InboundDomain]
        Actions:
          - S3Action:
              BucketName: !Ref MailBucket
              ObjectKeyPrefix: raw/
          - LambdaAction:
              FunctionArn: !If [UseWorkerAliases, !Ref InboundAlias, !GetAtt InboundFunction.Arn]
              InvocationType: Event

  # --- functions ------------------------------------------------------------

  SenderLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-sender"
      RetentionInDays: 90

  InboundLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-inbound"
      RetentionInDays: 90

  SenderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sender
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # DeleteItem: a failed send's reply address (store.drop_day),
                # and a standing address the profile did not take (set_inbox).
                Action: [dynamodb:Scan, dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem,
                         dynamodb:DeleteItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # The sender passes Content.Raw to SESv2 SendEmail, which SES
                # authorizes as ses:SendRawEmail. Recipients whose address is a
                # verified identity in this account are checked too, hence
                # identity/* rather than the sending domain alone.
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}"
                Condition:
                  # Only as Release Notes (compose.from_header hands SES
                  # "Release Notes <notes@...>"), never as another identity
                  # in this shared account.
                  StringLike:
                    ses:FromAddress:
                      - !Ref FromAddress
                      - !Sub "*<${FromAddress}>"
              - Effect: Allow
                # Photos in the email: their thumbnails only (thumbs.py),
                # never an original.
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/media/*.thumb.jpg"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt SenderLogs.Arn

  InboundRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: inbound
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObjectTagging]
                Resource: !Sub "${MailBucket.Arn}/raw/*"
              - Effect: Allow
                # A reply's photos and recordings, copied out of it.
                Action: s3:PutObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # UpdateItem: a late reply's notice, marked on its reply
                # address and counted against the subscriber's day.
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # The late-reply notice, as raw MIME through SESv2 (see SenderRole).
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}"
                Condition:
                  # Only as Release Notes, like the sender and web roles.
                  StringLike:
                    ses:FromAddress:
                      - !Ref FromAddress
                      - !Sub "*<${FromAddress}>"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt InboundLogs.Arn

  SenderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-sender"
      Description: Sends the daily version-number email
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.send.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt SenderRole.Arn
      MemorySize: 256
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref SenderLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          FROM_ADDRESS: !Ref FromAddress
          INBOUND_DOMAIN: !Ref InboundDomain
          CONFIG_SET: !Ref ConfigurationSet
          BUCKET: !Ref MailBucket

  InboundFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-inbound"
      Description: Files email replies as release notes
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.inbound.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt InboundRole.Arn
      MemorySize: 512
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref InboundLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          BUCKET: !Ref MailBucket
          INBOUND_DOMAIN: !Ref InboundDomain
          FROM_ADDRESS: !Ref FromAddress
          CONFIG_SET: !Ref ConfigurationSet

  InboundInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InboundFunction
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${AWS::StackName}:receipt-rule/replies"

  # Quarter hours, so a 20:00 send time lands at 20:00.
  SenderSchedule:
    Type: AWS::Events::Rule
    DependsOn: SenderAliasSchedulePermission
    Properties:
      Description: Run the Release Notes sender every 15 minutes
      ScheduleExpression: cron(0/15 * * * ? *)
      State: ENABLED
      Targets:
        - Id: sender
          Arn: !If [UseWorkerAliases, !Ref SenderAlias, !GetAtt SenderFunction.Arn]

  SenderSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SenderFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SenderSchedule.Arn

  # --- web app: notes.yourversionnumber.com -----------------------------------
  #
  # The same shape as Drop and Thingy: CloudFront in front, a private S3
  # bucket of static pages as the default origin, and an HTTP API for /api/*.
  # Same origin for both, so there is no CORS and the session cookie is
  # host-only.

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-web-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ListBucket so a missing page is an honest 404, not S3's 403.
          - Sid: CloudFrontReads
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: [s3:GetObject, s3:ListBucket]
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        Description: Private access from the Release Notes distribution to its web bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The web app is one page: any address but a file (/settings/,
  # /day/?d=...) is index.html, and the app's router shows the page. A file
  # (a name with a dot) is served as is. /api/* never runs it.
  WebIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-index"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve the app for every address that is not a file
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            request.uri = '/index.html';
          }
          return request;
        }

  WebCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-static"
        Comment: Static pages, honouring the Cache-Control deploy.sh sets
        DefaultTTL: 300
        MinTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true

  # Pages load only their own files: no inline script or style, nothing
  # remote. Lookups that need another service (the city search) go through
  # /api. connect-src adds Tinylytics, for the app's page count, and the
  # mail bucket's host, for uploads. Photos and recordings come from that
  # host, by a link the API signs for their owner (img-src and media-src
  # name only that host).
  # media-src also takes blob:, so a recording made on the page plays back
  # before it is sent. Permissions-Policy lets the page itself use the
  # microphone (the new-note form's Record button) and turns off the
  # camera, location, payment and USB, which the app never asks for.
  WebHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-web"
        Comment: Security headers for notes.yourversionnumber.com
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://${MailBucket.RegionalDomainName}; media-src 'self' blob: https://${MailBucket.RegionalDomainName}; font-src 'self'; connect-src 'self' https://tinylytics.app https://${MailBucket.RegionalDomainName}; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: same-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: false
            Preload: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: "microphone=(self), camera=(), geolocation=(), payment=(), usb=()"
              Override: true

  # What the API sees of a request: only what it reads. The viewer's address
  # (for the sign-in email limits) is a CloudFront header, which the managed
  # AllViewer policies leave out; Host stays out so API Gateway gets its own.
  # X-Origin-Verify is not listed: it is the api origin's custom header,
  # which CloudFront always sends, over any viewer's header of that name.
  WebApiRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-api"
        Comment: Release Notes API - origin, content type, viewer address, session cookie
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Origin, Content-Type, Accept, CloudFront-Viewer-Address]
        CookiesConfig:
          CookieBehavior: whitelist
          Cookies: [__Host-rn]
        QueryStringsConfig:
          QueryStringBehavior: all

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Release Notes web app and its same-origin API
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasWebCertificate, [!Ref WebDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasWebCertificate
          - AcmCertificateArn: !Ref WebCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${WebApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
            # The web function answers only requests carrying this (OriginSecret).
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub "{{resolve:secretsmanager:${OriginSecret}:SecretString}}"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - !If
            - RouteNativeHttp
            - Id: native-app
              DomainName: !GetAtt NativeAppLiveEndpoint.DomainName
              OriginAccessControlId: !Ref NativeOriginAccessControl
              CustomOriginConfig:
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
            - !Ref AWS::NoValue
          - !If
            - RouteNativeHttp
            - Id: native-mcp
              DomainName: !GetAtt NativeMcpLiveEndpoint.DomainName
              OriginAccessControlId: !Ref NativeOriginAccessControl
              CustomOriginConfig:
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref WebCachePolicy
          ResponseHeadersPolicyId: !Ref WebHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebIndexFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # The managed CachingDisabled policy, and our own origin request
          # policy below.
          - PathPattern: /api/*
            TargetOriginId: !If [RouteNativeHttp, native-app, api]
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !If [RouteNativeHttp, !Ref NativeHttpCachePolicy, 4135ea2d-6df8-44a3-9df3-4b5a84be39ad]
            OriginRequestPolicyId: !If [RouteNativeHttp, !Ref NativeHttpRequestPolicy, !Ref WebApiRequestPolicy]
            ResponseHeadersPolicyId: !Ref WebHeadersPolicy

          - PathPattern: /mcp
            TargetOriginId: !If [RouteNativeHttp, native-mcp, api]
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !If [RouteNativeHttp, !Ref NativeHttpCachePolicy, 4135ea2d-6df8-44a3-9df3-4b5a84be39ad]
            # AllViewerExceptHostHeader forwards Authorization and MCP headers.
            # The cookie is ignored by the separate MCP handler.
            OriginRequestPolicyId: !If [RouteNativeHttp, !Ref NativeHttpRequestPolicy, b689b0a8-53d0-40ab-baf2-68738e2966ac]
          - PathPattern: /oauth/*
            TargetOriginId: !If [RouteNativeHttp, native-app, api]
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !If [RouteNativeHttp, !Ref NativeHttpCachePolicy, 4135ea2d-6df8-44a3-9df3-4b5a84be39ad]
            OriginRequestPolicyId: !If [RouteNativeHttp, !Ref NativeHttpRequestPolicy, !Ref WebApiRequestPolicy]
          - PathPattern: /.well-known/oauth-*
            TargetOriginId: !If [RouteNativeHttp, native-app, api]
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !If [RouteNativeHttp, !Ref NativeHttpCachePolicy, 4135ea2d-6df8-44a3-9df3-4b5a84be39ad]
            OriginRequestPolicyId: !If [RouteNativeHttp, !Ref NativeHttpRequestPolicy, !Ref WebApiRequestPolicy]

  # The API's own execute-api URL cannot be turned off (it is CloudFront's
  # origin), so CloudFront proves itself: it sends this value as
  # X-Origin-Verify on every request to the API, and the web function refuses
  # any request without it. That makes CloudFront-Viewer-Address, which the
  # sign-in limits trust, and Origin CloudFront's own. Generated here and
  # resolved by CloudFormation into the distribution and the function's
  # environment; nobody needs to read it.
  OriginSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-origin"
      Description: Release Notes - the header value CloudFront sends the web API, so the API answers only through CloudFront
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true
        IncludeSpace: false

  WebApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-web"
      Description: The Release Notes web app's API, reached through CloudFront at /api/*
      ProtocolType: HTTP

  WebApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WebFunction.Arn
      PayloadFormatVersion: "2.0"

  WebApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebApi
      RouteKey: ANY /api/{proxy+}
      Target: !Sub "integrations/${WebApiIntegration}"

  OAuthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebApi
      RouteKey: ANY /oauth/{proxy+}
      Target: !Sub "integrations/${WebApiIntegration}"

  OAuthMetadataRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebApi
      RouteKey: ANY /.well-known/oauth-authorization-server
      Target: !Sub "integrations/${WebApiIntegration}"

  ProtectedMetadataRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebApi
      RouteKey: ANY /.well-known/oauth-protected-resource
      Target: !Sub "integrations/${WebApiIntegration}"

  ProtectedMcpMetadataRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebApi
      RouteKey: ANY /.well-known/oauth-protected-resource/mcp
      Target: !Sub "integrations/${WebApiIntegration}"

  McpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt McpFunction.Arn
      PayloadFormatVersion: "2.0"

  McpRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebApi
      RouteKey: ANY /mcp
      Target: !Sub "integrations/${McpIntegration}"

  # A ceiling for the whole API, well above one person's use. Per-address
  # and per-IP limits on sign-in mail live in the function.
  WebApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  WebInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebApi}/*"

  WebLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-web"
      RetentionInDays: 90

  # Logs only for now. Table access arrives with the sign-in that needs it.
  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: web
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # Sign-up writes the EMAIL and PROFILE items in one transaction,
                # which IAM authorizes as a PutItem for each. Deleting an
                # account deletes its items in batches.
                Action:
                  - dynamodb:ConditionCheckItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # The sign-in email, as raw MIME through SESv2 (see SenderRole).
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}"
                Condition:
                  # Only as Release Notes (compose.from_header hands SES
                  # "Release Notes <notes@...>"), never as another identity
                  # in this shared account.
                  StringLike:
                    ses:FromAddress:
                      - !Ref FromAddress
                      - !Sub "*<${FromAddress}>"
              - Effect: Allow
                # Deleting an emailed note (or the account) deletes the emails
                # behind it. The bucket is versioned: old versions expire 30
                # days on. DeleteObjects is authorized per object as this.
                Action: s3:DeleteObject
                Resource:
                  - !Sub "${MailBucket.Arn}/raw/*"
                  - !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # Signs the ten-minute link to a photo or recording for its
                # owner (web.media_file), and the link to a built zip export.
                # Nothing under raw/.
                Action: s3:GetObject
                Resource:
                  - !Sub "${MailBucket.Arn}/media/*"
                  - !Sub "${MailBucket.Arn}/exports/*"
              - Effect: Allow
                # Files from the web (media.py): signs the form that sends one
                # straight to the bucket, tagged pending (the form posts as
                # this role, so it needs the put and the tag), reads its
                # tags and first bytes, then copies the version it checked
                # and deletes that version once a note takes it.
                Action:
                  - s3:PutObject
                  - s3:PutObjectTagging
                  - s3:GetObjectTagging
                  - s3:GetObjectVersion
                  - s3:DeleteObjectVersion
                Resource: !Sub "${MailBucket.Arn}/media/*/web/*"
              - Effect: Allow
                # Where that copy is kept, tagged kept: no form writes here.
                Action: [s3:PutObject, s3:PutObjectTagging]
                Resource: !Sub "${MailBucket.Arn}/media/*/files/*"
              - Effect: Allow
                # A new zip export replaces the last; deleting the account
                # deletes it.
                Action: s3:DeleteObject
                Resource: !Sub "${MailBucket.Arn}/exports/*"
              - Effect: Allow
                # Starts a zip export, without waiting for it.
                Action: lambda:InvokeFunction
                Resource: !GetAtt ExportFunction.Arn
              - Effect: Allow
                # Stable worker entry point; the unqualified grant above drains
                # requests accepted before this release.
                Action: lambda:InvokeFunction
                Resource: !Ref ExportAlias
              - Effect: Allow
                # Sends a new subscriber today's email at sign-up, without
                # waiting for it (web.send_first).
                Action: lambda:InvokeFunction
                Resource: !GetAtt SenderFunction.Arn
              - Effect: Allow
                # Stable worker entry point; the unqualified grant above drains
                # requests accepted before this release.
                Action: lambda:InvokeFunction
                Resource: !Ref SenderAlias
              - Effect: Allow
                # Starting the emails again after a hard bounce or complaint
                # takes the address off SES's account-level suppression list
                # (web.unsuppress). The action takes no resource ARN.
                Action: ses:DeleteSuppressedDestination
                Resource: "*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !GetAtt WebLogs.Arn
                  - !GetAtt NativeAppLogs.Arn
                  - !GetAtt NativeAppLocalLogs.Arn

  # After the distribution: CloudFormation waits for a distribution update to
  # reach every edge location before moving on, so the function starts
  # asking for X-Origin-Verify only once CloudFront sends it everywhere. Run
  # the other way round, the API would refuse CloudFront for those minutes.
  WebFunction:
    Type: AWS::Lambda::Function
    DependsOn: [WebDistribution, ExportAliasInvokeConfig]
    Properties:
      FunctionName: !Sub "${AWS::StackName}-web"
      Description: The Release Notes web app's API
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.web.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt WebRole.Arn
      # CPU comes with memory. At 256 MB a fresh start spent 2.3 to 3 seconds
      # loading boto3 and building its clients before the first answer.
      MemorySize: 1024
      # Under the HTTP API's 30 seconds, for deleting a long-kept account.
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref WebLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          WEB_ORIGIN: !Sub "https://${WebDomain}"
          ORIGIN_SECRET: !Sub "{{resolve:secretsmanager:${OriginSecret}:SecretString}}"
          FROM_ADDRESS: !Ref FromAddress
          CONFIG_SET: !Ref ConfigurationSet
          MAIL_BUCKET: !Ref MailBucket
          EXPORT_FUNCTION: !If [UseWorkerAliases, !Ref ExportAlias, !Ref ExportFunction]
          SENDER_FUNCTION: !If [UseWorkerAliases, !Ref SenderAlias, !Ref SenderFunction]
          INBOUND_DOMAIN: !Ref InboundDomain

  McpLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-mcp"
      RetentionInDays: 14

  McpRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-only-notes
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:ConditionCheckItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*", "OAUTHACCESS#*", "OAUTHFAMILY#*", "MCPMETA#*"]
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["MCPMETA#*"]
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CaptureFunction.Arn
              - Effect: Allow
                # Stable worker entry point; the unqualified grant above drains
                # requests accepted before this release.
                Action: lambda:InvokeFunction
                Resource: !Ref CaptureAlias
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource:
                  - !GetAtt McpLogs.Arn
                  - !GetAtt NativeMcpLogs.Arn
                  - !GetAtt NativeMcpLocalLogs.Arn

  McpFunction:
    Type: AWS::Lambda::Function
    DependsOn: WebDistribution
    Properties:
      FunctionName: !Sub "${AWS::StackName}-mcp"
      Description: Personal notes over MCP; reading and delegated text capture
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.mcp.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt McpRole.Arn
      MemorySize: 1024
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref McpLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          WEB_ORIGIN: !Sub "https://${WebDomain}"
          ORIGIN_SECRET: !Sub "{{resolve:secretsmanager:${OriginSecret}:SecretString}}"
          MAIL_BUCKET: !Ref MailBucket
          CAPTURE_FUNCTION: !If [UseWorkerAliases, !Ref CaptureAlias, !Ref CaptureFunction]

  CaptureLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-capture"
      RetentionInDays: 14

  CaptureRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: owner-approved-capture
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*", "OAUTHACCESS#*", "OAUTHFAMILY#*", "MCPMETA#*"]
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*", "MCPMETA#*"]
              - Effect: Allow
                Action: [dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*"]
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CaptureLogs.Arn

  CaptureFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-capture"
      Description: Private owner-approved MCP text capture; create and append only
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.capture.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt CaptureRole.Arn
      MemorySize: 1024
      Timeout: 20
      LoggingConfig:
        LogGroup: !Ref CaptureLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          WEB_ORIGIN: !Sub "https://${WebDomain}"

  McpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref McpFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebApi}/*"

  # --- the zip export ---------------------------------------------------------
  # Every note, photo and recording in one zip, built in the background
  # (export_job.py) because it can outgrow an API answer. The web function
  # invokes it and the page asks how it is going.

  ExportLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-export"
      RetentionInDays: 90

  ExportRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: export
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # The photos and recordings that go in. Nothing under raw/.
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # The zip, uploaded in parts when large; a replaced build
                # deletes its own.
                Action: [s3:PutObject, s3:AbortMultipartUpload, s3:DeleteObject]
                Resource: !Sub "${MailBucket.Arn}/exports/*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ExportLogs.Arn

  ExportFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-export"
      Description: Builds a subscriber's zip export with every photo and recording
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.export_job.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt ExportRole.Arn
      MemorySize: 1024
      Timeout: 900
      # At most two builds at once, whoever asks. A build started past that
      # is throttled, and Lambda tries an async event again for up to six
      # hours (MaximumRetryAttempts counts function errors, not throttles).
      ReservedConcurrentExecutions: 2
      # The zip is written to local disk before it is uploaded. Billed only
      # while a build runs.
      EphemeralStorage:
        Size: 10240
      LoggingConfig:
        LogGroup: !Ref ExportLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          MAIL_BUCKET: !Ref MailBucket

  # A failed build is marked failed and the person starts another; Lambda's
  # own retries would only race the new one.
  ExportInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ExportFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  # --- bounces and complaints -----------------------------------------------
  # The configuration set publishes SES's events to their own topic
  # (MailEventsTopic), never the ops queue: they carry addresses. This
  # function stops the subscriber on a hard bounce or complaint and puts
  # one scrubbed line on the alarms topic.

  EventsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-events"
      RetentionInDays: 90

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # Content-free SNS idempotency receipt, owned/deleted with the account.
                Action: dynamodb:PutItem
                Resource: !GetAtt Table.Arn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ["USER#*"]
              - Effect: Allow
                # The scrubbed line for the ops queue.
                Action: sns:Publish
                Resource: !Ref AlarmTopic
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FailedQueue.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt EventsLogs.Arn

  EventsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-events"
      Description: Stops a subscriber's emails after a hard bounce or a complaint; tells ops without addresses
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.events.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt EventsRole.Arn
      MemorySize: 128
      Timeout: 30
      # A bounce or complaint that could not be applied, after Lambda's two
      # retries, waits here rather than being lost.
      DeadLetterConfig:
        TargetArn: !GetAtt FailedQueue.Arn
      LoggingConfig:
        LogGroup: !Ref EventsLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          ALARM_TOPIC: !Ref AlarmTopic

  EventsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: [EventsInvokePermission, EventsAliasInvokePermission, EventsAliasInvokeConfig]
    Properties:
      TopicArn: !Ref MailEventsTopic
      Protocol: lambda
      Endpoint: !If [UseEventsAlias, !Ref EventsAlias, !GetAtt EventsFunction.Arn]

  EventsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventsFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref MailEventsTopic

  # The bridge must already be in BOTH handlers before subscription
  # replacement: CloudFormation creates the new SNS subscription before
  # deleting the old one. Their shared receipt makes overlap safe.
  EventsPythonVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref EventsFunction
      CodeSha256: !Ref EventsPythonCodeSha256
      Description: Complete idempotent Python rollback bridge before the Node 24 rebuild

  EventsAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref EventsFunction
      FunctionVersion: !GetAtt EventsPythonVersion.Version

  EventsAliasInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventsAlias
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref MailEventsTopic

  EventsAliasInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref EventsFunction
      Qualifier: live
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 21600

  # --- transcripts -------------------------------------------------------------
  # Recordings written out as text for subscribers who turn it on
  # (transcribe.py): the table's stream starts Amazon Transcribe jobs, and
  # each job's state change brings the words back to the note.

  TranscribeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-transcribe"
      RetentionInDays: 90

  TranscribeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: transcribe
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator]
                Resource: !GetAtt Table.StreamArn
              - Effect: Allow
                Action: dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                # Starting a job names no resource, so "*", but only with
                # its output in the mail bucket (transcribe.py's OutputBucketName).
                Action: transcribe:StartTranscriptionJob
                Resource: "*"
                Condition:
                  StringEquals:
                    transcribe:OutputBucketName: !Ref MailBucket
              - Effect: Allow
                # Only this product's jobs (transcribe.job_name's prefix).
                Action: transcribe:DeleteTranscriptionJob
                Resource: !Sub "arn:${AWS::Partition}:transcribe:${AWS::Region}:${AWS::AccountId}:transcription-job/release-notes.*"
              - Effect: Allow
                # Transcribe reads the recording and writes its JSON as
                # this role.
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject]
                Resource: !Sub "${MailBucket.Arn}/transcripts/*"
              - Effect: Allow
                # Transcribe's empty test write before a job, should it go
                # to the top of the bucket rather than beside the output.
                Action: s3:PutObject
                Resource: !Sub "${MailBucket.Arn}/.write_access_check_file.temp"
              - Effect: Allow
                # Where a stream batch goes after its last retry.
                Action: sqs:SendMessage
                Resource: !GetAtt FailedQueue.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt TranscribeLogs.Arn

  TranscribeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-transcribe"
      Description: Writes out recordings as text for subscribers who turned it on
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.transcribe.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt TranscribeRole.Arn
      MemorySize: 256
      Timeout: 120
      # A ceiling on jobs started at once. A throttled stream batch waits
      # and is tried again (throttles do not use up its retries); a
      # throttled job event is an async event, tried for up to six hours.
      ReservedConcurrentExecutions: 2
      LoggingConfig:
        LogGroup: !Ref TranscribeLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          BUCKET: !Ref MailBucket

  TranscribeStream:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !If [UseWorkerAliases, !Ref TranscribeAlias, !Ref TranscribeFunction]
      EventSourceArn: !GetAtt Table.StreamArn
      StartingPosition: LATEST
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailedQueue.Arn
      BatchSize: 25
      MaximumRetryAttempts: 3
      BisectBatchOnFunctionError: true
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName": ["INSERT", "MODIFY"], "dynamodb": {"NewImage": {"sk": {"S": [{"prefix": "NOTE#"}]}}}}'
          - Pattern: '{"eventName": ["INSERT", "MODIFY"], "dynamodb": {"NewImage": {"sk": {"S": ["PROFILE"]}, "transcribe": {"BOOL": [true]}}}}'

  TranscribeDone:
    Type: AWS::Events::Rule
    DependsOn: TranscribeAliasDonePermission
    Properties:
      Description: A Release Notes transcription job finished
      EventPattern:
        source: [aws.transcribe]
        detail-type: [Transcribe Job State Change]
        detail:
          TranscriptionJobStatus: [COMPLETED, FAILED]
          TranscriptionJobName: [{ prefix: release-notes. }]
      State: ENABLED
      Targets:
        - Id: transcribe
          Arn: !If [UseWorkerAliases, !Ref TranscribeAlias, !GetAtt TranscribeFunction.Arn]

  TranscribeDonePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TranscribeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TranscribeDone.Arn

  # --- photos: thumbnails and descriptions ---------------------------------------
  # describe.py: every photo's thumbnail (thumbs.py, for everyone), then
  # Claude, through the Anthropic API, describes each photo, for subscribers who
  # turned it on, from the same stream; turning it on starts a pass over
  # every photo already kept, which hands on to a new pass near its limit.
  # A JPEG's EXIF spot names a note with no place (Amazon Location, places.py).
  # One function for all of it: a third reader of the stream would pass the
  # two readers a shard DynamoDB Streams allows without throttling.

  PillowLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-pillow"
      Description: Pillow, pinned in layers/pillow.txt, for thumbnails (thumbs.py)
      CompatibleRuntimes: [python3.13]
      CompatibleArchitectures: [arm64]
      Content: { S3Bucket: !Ref CodeBucket, S3Key: !Ref PillowLayerKey }

  DescribeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-describe"
      RetentionInDays: 90

  DescribeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: describe
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # Scan: the one-off thumbnail pass over everyone, profiles' keys only.
                # PutItem: a past day's weather, kept again where a photo
                # says the day was (weather.keep_day). DeleteItem: that
                # day's weather for another place, when none can be had
                # for the photo's.
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem, dynamodb:PutItem, dynamodb:DeleteItem,
                         dynamodb:Scan]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator]
                Resource: !GetAtt Table.StreamArn
              - Effect: Allow
                Action: dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # Each photo's thumbnail, beside it, and taking one back
                # when its note went meanwhile (thumbs.py).
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${MailBucket.Arn}/media/*.thumb.jpg"
              - Effect: Allow
                # The Anthropic API key. The secret is made by hand outside
                # the stack (its value never passes through a template);
                # the ?????? is the suffix Secrets Manager adds.
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${AnthropicSecretName}-??????"
              - Effect: Allow
                # Naming a photo's place, at the city, to keep (places.reverse).
                Action: geo-places:ReverseGeocode
                Resource: !Sub "arn:${AWS::Partition}:geo-places:${AWS::Region}::provider/default"
              - Effect: Allow
                # The next pass over photos already kept. By name, since the
                # function's own ARN would make a cycle.
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-describe"
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-describe:live"
              - Effect: Allow
                # Where a stream batch goes after its last retry.
                Action: sqs:SendMessage
                Resource: !GetAtt FailedQueue.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DescribeLogs.Arn

  DescribeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-describe"
      Description: Makes photo thumbnails, names notes' places from photos, and describes photos for subscribers who turned it on
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.describe.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Layers: [!Ref PillowLayer]
      Role: !GetAtt DescribeRole.Arn
      # Decoding a phone's photo for its thumbnail; more memory is more CPU too.
      MemorySize: 1024
      Timeout: 900
      # A ceiling on photos going to the model at once: a pass and a stream
      # batch, say. A throttled stream batch waits and is tried again
      # (throttles do not use up its retries); a throttled next pass is an
      # async event, tried for up to six hours, carrying its chain (describe.py).
      ReservedConcurrentExecutions: 2
      LoggingConfig:
        LogGroup: !Ref DescribeLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          BUCKET: !Ref MailBucket
          SELF: !If [UseWorkerAliases, !Sub "${AWS::StackName}-describe:live", !Sub "${AWS::StackName}-describe"]
          SECRET: !Ref AnthropicSecretName

  DescribeInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref DescribeFunction
      Qualifier: $LATEST
      # A pass that failed (throttled, say) tries again; photos done are
      # skipped.
      MaximumRetryAttempts: 2

  DescribeStream:
    Type: AWS::Lambda::EventSourceMapping
    DependsOn: DescribeAliasInvokeConfig
    Properties:
      FunctionName: !If [UseWorkerAliases, !Ref DescribeAlias, !Ref DescribeFunction]
      EventSourceArn: !GetAtt Table.StreamArn
      StartingPosition: LATEST
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailedQueue.Arn
      BatchSize: 5
      MaximumRetryAttempts: 3
      BisectBatchOnFunctionError: true
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName": ["INSERT", "MODIFY"], "dynamodb": {"NewImage": {"sk": {"S": [{"prefix": "NOTE#"}]}}}}'
          - Pattern: '{"eventName": ["INSERT", "MODIFY"], "dynamodb": {"NewImage": {"sk": {"S": ["PROFILE"]}, "describe": {"BOOL": [true]}}}}'

  # --- immutable worker baselines and stable entry points -------------------
  # Deploy WorkerAliasesReady=false first, then true. The first pass creates
  # aliases before SELF or trigger destinations can name them. The second
  # publishes their final Python configuration before moving :live.
  # Keep $LATEST async settings and unqualified invoke permissions until old
  # requests drain. Runtime/code replacements later publish a complete Node
  # version before moving :live; these Python versions remain rollback targets.

  SenderPythonVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref SenderFunction
      Description: Compatible Python baseline before the Node 24 rebuild

  SenderAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref SenderFunction
      FunctionVersion: !GetAtt SenderPythonVersion.Version

  InboundPythonVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref InboundFunction
      Description: Compatible Python baseline before the Node 24 rebuild

  InboundAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref InboundFunction
      FunctionVersion: !GetAtt InboundPythonVersion.Version

  TranscribePythonVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref TranscribeFunction
      Description: Compatible Python baseline before the Node 24 rebuild

  TranscribeAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref TranscribeFunction
      FunctionVersion: !GetAtt TranscribePythonVersion.Version

  DescribeBootstrapVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref DescribeFunction
      Description: Compatible Python baseline before the Node 24 rebuild

  DescribePythonVersion:
    Type: AWS::Lambda::Version
    Condition: UseWorkerAliases
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref DescribeFunction
      Description: Complete Python rollback configuration with stable worker targets

  DescribeAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref DescribeFunction
      FunctionVersion: !If [UseWorkerAliases, !GetAtt DescribePythonVersion.Version, !GetAtt DescribeBootstrapVersion.Version]

  ExportPythonVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref ExportFunction
      Description: Compatible Python baseline before the Node 24 rebuild

  ExportAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref ExportFunction
      FunctionVersion: !GetAtt ExportPythonVersion.Version

  CapturePythonVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref CaptureFunction
      Description: Compatible Python baseline before the Node 24 rebuild

  CaptureAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref CaptureFunction
      FunctionVersion: !GetAtt CapturePythonVersion.Version

  InboundAliasInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InboundAlias
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${AWS::StackName}:receipt-rule/replies"

  SenderAliasSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SenderAlias
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !Ref SenderScheduleArn

  TranscribeAliasDonePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TranscribeAlias
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !Ref TranscribeDoneArn

  ExportAliasInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: ExportAlias
    Properties:
      FunctionName: !Ref ExportFunction
      Qualifier: live
      MaximumRetryAttempts: 0

  DescribeAliasInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    DependsOn: DescribeAlias
    Properties:
      FunctionName: !Ref DescribeFunction
      Qualifier: live
      MaximumRetryAttempts: 2

  # --- alarms -----------------------------------------------------------------

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudWatchAlarms
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlarmQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: sqs
      Endpoint: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${OpsQueueName}"
      RawMessageDelivery: true

  # What would otherwise be dropped after its retries: a bounce or complaint
  # event the events function could not apply (the SNS message, which names
  # the address, so it stays here and never goes to the ops queue), and a
  # stream batch the transcriber or describer gave up on (the shard and
  # sequence numbers only, no note text). Kept 14 days. Read it, fix the
  # cause, and apply or replay by hand.
  FailedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-failed"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  FailedQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-failed-queue"
      AlarmDescription: Something gave up after its retries and is waiting in the failed queue. A bounce may not have stopped its subscriber.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt FailedQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  SenderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-sender-errors"
      AlarmDescription: The daily sender failed. Someone may not have had today's email.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref SenderFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  McpErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-mcp-errors"
      AlarmDescription: Release Notes MCP function errors
      Metrics:
        - Id: failures
          Expression: SUM(METRICS())
          ReturnData: true
        - Id: reader
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref McpFunction }]
            Stat: Sum
            Period: 300
        - Id: writer
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions: [{ Name: FunctionName, Value: !Ref CaptureFunction }]
            Stat: Sum
            Period: 300
        - Id: tools
          ReturnData: false
          MetricStat:
            Metric: { Namespace: ReleaseNotes, MetricName: McpFailures }
            Stat: Sum
            Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  WebErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-web-errors"
      AlarmDescription: The web app's API failed a request.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref WebFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The hour's sign-in emails, for everyone, have all gone (auth.LIMIT_TOTAL):
  # until the hour turns nobody can sign in or get a deletion code. The web
  # function logs {"event":"mail-limited","limit":"total"} for each refusal.
  SignInTotalMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WebLogs
      FilterPattern: '{ $.event = "mail-limited" && $.limit = "total" }'
      MetricTransformations:
        - MetricNamespace: ReleaseNotes
          MetricName: SignInTotalLimited
          MetricValue: "1"

  SignInTotalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-signin-total"
      AlarmDescription: The hour's sign-in emails for everyone are used up. Nobody can sign in until the hour turns; someone may be sending from many networks.
      Namespace: ReleaseNotes
      MetricName: SignInTotalLimited
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  EventsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-events-errors"
      AlarmDescription: A bounce or complaint could not be applied to its subscriber.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref EventsFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ExportErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-export-errors"
      AlarmDescription: A zip export failed to build. The page says so and offers to try again.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ExportFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  TranscribeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-transcribe-errors"
      AlarmDescription: A recording's transcript could not be started or kept. The recording itself is safe.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref TranscribeFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DescribeErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-describe-errors"
      AlarmDescription: A photo's description could not be made or kept. The photo itself is safe.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref DescribeFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  InboundErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-inbound-errors"
      AlarmDescription: A reply failed to file. The raw message is still in the mail bucket.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref InboundFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Anyone's email overdue: their send time was over half an hour ago and
  # nothing went (census.py). A count from the sender's census line.
  OverdueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-overdue"
      AlarmDescription: Someone's daily email is over half an hour late. The sender may be failing, or a send time moved past today's window.
      Namespace: ReleaseNotes
      MetricName: Overdue
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The operations dashboard (Jamie, 2026-10-09). Counts only: no address,
  # no user id, no note text. Behind AWS sign-in, so nothing in the web app.
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref AWS::StackName
      DashboardBody: !Sub |
        {
          "start": "-P14D",
          "periodOverride": "inherit",
          "widgets": [
            {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {
              "markdown": "# Release Notes\nCounts only: no addresses, no note text. Subscribers, notes and writers come from the sender's census line every quarter hour (`census.py`); emails from SES; mail in and account events from the functions' logs, kept 90 days. One row per person: `scripts/subscribers.py`."}},
            {"type": "alarm", "x": 0, "y": 2, "width": 24, "height": 3, "properties": {
              "title": "Alarms",
              "alarms": ["${SenderErrorsAlarm.Arn}", "${OverdueAlarm.Arn}", "${InboundErrorsAlarm.Arn}", "${EventsErrorsAlarm.Arn}", "${WebErrorsAlarm.Arn}", "${McpErrorsAlarm.Arn}", "${ExportErrorsAlarm.Arn}", "${FailedQueueAlarm.Arn}", "${NativeAppErrorsAlarm.Arn}", "${NativeMcpErrorsAlarm.Arn}", "${NativeAppCapacityAlarm.Arn}", "${NativeMcpCapacityAlarm.Arn}", "${NativeAppRateAlarm.Arn}", "${NativeMcpRateAlarm.Arn}"]}},
            {"type": "metric", "x": 0, "y": 5, "width": 24, "height": 4, "properties": {
              "title": "Right now", "view": "singleValue", "region": "${AWS::Region}",
              "period": 900, "stat": "Maximum", "setPeriodToTimeRange": false, "sparkline": true,
              "metrics": [
                ["ReleaseNotes", "Subscribers", {"label": "Getting the email"}],
                ["ReleaseNotes", "Paused", {"label": "Paused"}],
                ["ReleaseNotes", "Stopped", {"label": "Stopped"}],
                ["ReleaseNotes", "Overdue", {"label": "Email overdue"}],
                ["ReleaseNotes", "Notes", {"label": "Notes"}],
                ["ReleaseNotes", "Writers7", {"label": "Wrote this week"}],
                ["ReleaseNotes", "ReplyRate30", {"label": "Reply rate, 30 days (%)"}]
              ]}},
            {"type": "metric", "x": 0, "y": 9, "width": 12, "height": 6, "properties": {
              "title": "Emails a day, by kind (SES)", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 86400, "stat": "Sum",
              "metrics": [
                [{"expression": "SEARCH('{AWS/SES,\"release-notes-mail\"}', 'Sum', 86400)", "id": "mail"}]
              ]}},
            {"type": "metric", "x": 12, "y": 9, "width": 12, "height": 6, "properties": {
              "title": "SES account reputation", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 3600, "stat": "Maximum",
              "metrics": [
                ["AWS/SES", "Reputation.BounceRate", {"label": "Bounce rate"}],
                ["AWS/SES", "Reputation.ComplaintRate", {"label": "Complaint rate", "yAxis": "right"}]
              ],
              "annotations": {"horizontal": [
                {"value": 0.05, "label": "Bounces: AWS reviews at 5%"},
                {"value": 0.001, "label": "Complaints: AWS reviews at 0.1%", "yAxis": "right"}
              ]}}},
            {"type": "metric", "x": 0, "y": 15, "width": 12, "height": 6, "properties": {
              "title": "Notes, by where they came from", "view": "timeSeries", "stacked": true, "region": "${AWS::Region}",
              "period": 3600, "stat": "Maximum",
              "metrics": [
                ["ReleaseNotes", "EmailNotes", {"label": "By email"}],
                ["ReleaseNotes", "WebNotes", {"label": "On the web"}],
                ["ReleaseNotes", "ImportedNotes", {"label": "Imported"}],
                ["ReleaseNotes", "AgentNotes", {"label": "Added by agents"}]
              ]}},
            {"type": "metric", "x": 12, "y": 15, "width": 12, "height": 6, "properties": {
              "title": "Subscribers and writers", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 3600, "stat": "Maximum",
              "metrics": [
                ["ReleaseNotes", "Subscribers", {"label": "Getting the email"}],
                ["ReleaseNotes", "Writers7", {"label": "Wrote in the last 7 days"}],
                ["ReleaseNotes", "Writers30", {"label": "Wrote in the last 30 days"}],
                ["ReleaseNotes", "ReplyRate30", {"label": "Reply rate, 30 days (%)", "yAxis": "right"}]
              ]}},
            {"type": "log", "x": 0, "y": 21, "width": 12, "height": 6, "properties": {
              "title": "Mail in: filed or ignored, and why", "view": "table", "region": "${AWS::Region}",
              "query": "SOURCE '${InboundLogs}' | filter event = 'inbound' | stats count(*) as messages by outcome, reason | sort messages desc"}},
            {"type": "log", "x": 12, "y": 21, "width": 12, "height": 6, "properties": {
              "title": "Accounts: sign-ups, stops and sign-ins", "view": "table", "region": "${AWS::Region}",
              "query": "SOURCE '${WebLogs}' | SOURCE '${NativeAppLogs}' | SOURCE '${EventsLogs}' | fields coalesce(event, message.event) as kind, coalesce(reason, message.reason) as why | filter kind in ['signup', 'signin-sent', 'unsubscribe', 'pause', 'resume', 'account-deleted'] or (kind = 'mail-event' and outcome = 'stopped') | stats count(*) as times by kind, why | sort times desc"}},
            {"type": "metric", "x": 0, "y": 27, "width": 8, "height": 6, "properties": {
              "title": "Function errors", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 3600, "stat": "Sum",
              "metrics": [
                ["AWS/Lambda", "Errors", "FunctionName", "${SenderFunction}", {"label": "sender"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${InboundFunction}", {"label": "inbound"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${WebFunction}", {"label": "web"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${McpFunction}", {"label": "mcp"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${CaptureFunction}", {"label": "capture"}],
                ["ReleaseNotes", "McpFailures", {"label": "MCP tool failures"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${EventsFunction}", {"label": "events"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${ExportFunction}", {"label": "export"}]
              ]}},
            {"type": "metric", "x": 8, "y": 27, "width": 8, "height": 6, "properties": {
              "title": "Web API requests", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 3600, "stat": "Sum",
              "metrics": [
                ["AWS/ApiGateway", "Count", "ApiId", "${WebApi}", {"label": "requests"}],
                ["AWS/ApiGateway", "4xx", "ApiId", "${WebApi}", {"label": "4xx"}],
                ["AWS/ApiGateway", "5xx", "ApiId", "${WebApi}", {"label": "5xx"}]
              ]}},
            {"type": "metric", "x": 16, "y": 27, "width": 8, "height": 6, "properties": {
              "title": "Mail bucket size (emails, photos, exports)", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 86400, "stat": "Average",
              "metrics": [
                ["AWS/S3", "BucketSizeBytes", "BucketName", "${MailBucket}", "StorageType", "StandardStorage", {"label": "bytes"}]
              ]}},
            {"type": "log", "x": 0, "y": 33, "width": 24, "height": 7, "properties": {
              "title": "Recent problems", "view": "table", "region": "${AWS::Region}",
              "query": "SOURCE '${SenderLogs}' | SOURCE '${InboundLogs}' | SOURCE '${WebLogs}' | SOURCE '${EventsLogs}' | SOURCE '${ExportLogs}' | SOURCE '${McpLogs}' | SOURCE '${NativeAppLogs}' | SOURCE '${NativeMcpLogs}' | fields coalesce(event, message.event) as kind, coalesce(status, message.status) as responseStatus | filter (ispresent(kind) and (kind like /error|failed|out-of-time|census-skipped/ or responseStatus >= 500)) or (not ispresent(kind) and @message like /ERROR|Task timed out/) | fields @timestamp, @log, coalesce(kind, @message) as what, coalesce(error, message.error) as errorKind, coalesce(code, message.code) as errorCode, responseStatus | sort @timestamp desc | limit 25"}},
            {"type": "metric", "x": 0, "y": 40, "width": 12, "height": 6, "properties": {
              "title": "Native app HTTP", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 300, "stat": "Sum", "metrics": [
                ["AWS/Lambda/Web", "ExecutedRequests", "FunctionName", "${AWS::StackName}-web-native", "EndpointName", "live", {"label": "requests"}],
                ["AWS/Lambda/Web", "HTTPResponseStatusClass4XX", "FunctionName", "${AWS::StackName}-web-native", "EndpointName", "live", {"label": "4xx"}],
                ["AWS/Lambda/Web", "HTTPResponseStatusClass5XX", "FunctionName", "${AWS::StackName}-web-native", "EndpointName", "live", {"label": "5xx"}],
                ["AWS/Lambda/Web/Usage", "EndpointActiveEnvironmentThrottles", "FunctionName", "${AWS::StackName}-web-native", "EndpointName", "live", "ExecutionRegion", "${AWS::Region}", {"label": "environment throttles"}],
                ["AWS/Lambda/Web/Usage", "EndpointRequestThrottles", "FunctionName", "${AWS::StackName}-web-native", "EndpointName", "live", "ExecutionRegion", "${AWS::Region}", {"label": "rate throttles"}]
              ]}},
            {"type": "metric", "x": 12, "y": 40, "width": 12, "height": 6, "properties": {
              "title": "Native MCP HTTP", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 300, "stat": "Sum", "metrics": [
                ["AWS/Lambda/Web", "ExecutedRequests", "FunctionName", "${AWS::StackName}-mcp-native", "EndpointName", "live", {"label": "requests"}],
                ["AWS/Lambda/Web", "HTTPResponseStatusClass4XX", "FunctionName", "${AWS::StackName}-mcp-native", "EndpointName", "live", {"label": "4xx"}],
                ["AWS/Lambda/Web", "HTTPResponseStatusClass5XX", "FunctionName", "${AWS::StackName}-mcp-native", "EndpointName", "live", {"label": "5xx"}],
                ["AWS/Lambda/Web/Usage", "EndpointActiveEnvironmentThrottles", "FunctionName", "${AWS::StackName}-mcp-native", "EndpointName", "live", "ExecutionRegion", "${AWS::Region}", {"label": "environment throttles"}],
                ["AWS/Lambda/Web/Usage", "EndpointRequestThrottles", "FunctionName", "${AWS::StackName}-mcp-native", "EndpointName", "live", "ExecutionRegion", "${AWS::Region}", {"label": "rate throttles"}]
              ]}}
          ]
        }

Outputs:
  EventsWorkerAlias:
    Value: !Ref EventsAlias
  EventsPythonRollbackVersion:
    Value: !GetAtt EventsPythonVersion.Version
  NativeSourceBucketName:
    Value: !Ref NativeSourceBucket
  NativeAppFunctionArn:
    Condition: CreateNativeHttp
    Value: !GetAtt NativeAppFunction.FunctionArn
  NativeAppLiveEndpointArn:
    Condition: CreateNativeHttp
    Value: !GetAtt NativeAppLiveEndpoint.EndpointArn
  NativeAppLiveEndpointDomain:
    Condition: CreateNativeHttp
    Value: !GetAtt NativeAppLiveEndpoint.DomainName
  NativeAppCandidateRevisionId:
    Condition: CreateNativeHttp
    Value: !GetAtt NativeAppRevision.RevisionId
  NativeAppFunctionName:
    Condition: CreateNativeHttp
    Value: !Sub "${AWS::StackName}-web-native"
  NativeMcpFunctionArn:
    Condition: CreateNativeHttp
    Value: !GetAtt NativeMcpFunction.FunctionArn
  NativeMcpLiveEndpointArn:
    Condition: CreateNativeHttp
    Value: !GetAtt NativeMcpLiveEndpoint.EndpointArn
  NativeMcpLiveEndpointDomain:
    Condition: CreateNativeHttp
    Value: !GetAtt NativeMcpLiveEndpoint.DomainName
  NativeMcpCandidateRevisionId:
    Condition: CreateNativeHttp
    Value: !GetAtt NativeMcpRevision.RevisionId
  NativeMcpFunctionName:
    Condition: CreateNativeHttp
    Value: !Sub "${AWS::StackName}-mcp-native"
  TableName:
    Value: !Ref Table
  MailBucketName:
    Value: !Ref MailBucket
  ReceiptRuleSetName:
    Value: !Ref ReceiptRuleSet
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  WebBucketName:
    Value: !Ref WebBucket
  WebDistributionId:
    Value: !Ref WebDistribution
  WebDistributionDomain:
    Description: Where the notes CNAME points
    Value: !GetAtt WebDistribution.DomainName
  DkimRecord1:
    Value: !Sub "${EmailIdentity.DkimDNSTokenName1} CNAME ${EmailIdentity.DkimDNSTokenValue1}"
  DkimRecord2:
    Value: !Sub "${EmailIdentity.DkimDNSTokenName2} CNAME ${EmailIdentity.DkimDNSTokenValue2}"
  DkimRecord3:
    Value: !Sub "${EmailIdentity.DkimDNSTokenName3} CNAME ${EmailIdentity.DkimDNSTokenValue3}"
  DashboardUrl:
    Description: The operations dashboard
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${Dashboard}"
  SenderWorkerAlias:
    Value: !Ref SenderAlias
  SenderPythonRollbackVersion:
    Value: !GetAtt SenderPythonVersion.Version
  InboundWorkerAlias:
    Value: !Ref InboundAlias
  InboundPythonRollbackVersion:
    Value: !GetAtt InboundPythonVersion.Version
  TranscribeWorkerAlias:
    Value: !Ref TranscribeAlias
  TranscribePythonRollbackVersion:
    Value: !GetAtt TranscribePythonVersion.Version
  DescribeWorkerAlias:
    Value: !Ref DescribeAlias
  DescribePythonRollbackVersion:
    Value: !If [UseWorkerAliases, !GetAtt DescribePythonVersion.Version, !GetAtt DescribeBootstrapVersion.Version]
  ExportWorkerAlias:
    Value: !Ref ExportAlias
  ExportPythonRollbackVersion:
    Value: !GetAtt ExportPythonVersion.Version
  CaptureWorkerAlias:
    Value: !Ref CaptureAlias
  CapturePythonRollbackVersion:
    Value: !GetAtt CapturePythonVersion.Version
