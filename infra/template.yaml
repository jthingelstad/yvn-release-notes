AWSTemplateFormatVersion: "2010-09-09"
Description: Release Notes for Your Version Number - a daily version-number email whose replies are kept as notes

Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  Domain:
    Type: String
    Default: yourversionnumber.com
  InboundDomain:
    Type: String
    Default: in.yourversionnumber.com
    Description: MX points at SES; every reply address lives here.
  MailFromDomain:
    Type: String
    Default: bounce.yourversionnumber.com
  FromAddress:
    Type: String
    Default: notes@yourversionnumber.com
  OpsQueueName:
    Type: String
    Default: projects-ops-alerts
    Description: The account's alerts queue. Its policy must list this stack's alarm topic.
  WebDomain:
    Type: String
    Default: notes.yourversionnumber.com
  WebCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: ^$|^arn:aws:acm:us-east-1:[0-9]{12}:certificate/[0-9a-f-]+$
    Description: The us-east-1 ACM certificate for WebDomain, issued outside the stack (as Drop's is). deploy.sh passes it once ACM says ISSUED; until then the distribution answers on its cloudfront.net name only.

Conditions:
  HasWebCertificate: !Not [!Equals [!Ref WebCertificateArn, ""]]

Resources:
  # --- storage ------------------------------------------------------------

  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref AWS::StackName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
      # Sign-in links, sessions and rate-limit counters carry expires_at
      # (epoch seconds) and clear themselves. Nothing kept for good sets it.
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  # Raw inbound mail under raw/. Filed replies are kept; their photos and
  # recordings are copied to media/ (media.py) and kept too. Ignored mail
  # expires, and so do zip exports (exports/, offered for a day).
  MailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-mail-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-ignored-mail
            Status: Enabled
            TagFilters:
              - { Key: outcome, Value: ignored }
            ExpirationInDays: 30
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: expire-exports
            Status: Enabled
            Prefix: exports/
            ExpirationInDays: 2
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  MailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SesWritesInboundMail
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub "${MailBucket.Arn}/raw/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${AWS::StackName}:receipt-rule/*"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt MailBucket.Arn
              - !Sub "${MailBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # --- sending --------------------------------------------------------------

  ConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Ref AWS::StackName
      ReputationOptions:
        ReputationMetricsEnabled: true
      SuppressionOptions:
        SuppressedReasons: [BOUNCE, COMPLAINT]

  # Delivery problems go to the events function only (events.py): SES's
  # event carries the address, the subject (a sign-in code) and the reply
  # token, so it never goes to the ops queue as is. The function sends the
  # queue a line with the kind and the user id. No open or click events.
  ConfigurationSetEvents:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: mail-events
        Enabled: true
        MatchingEventTypes: [bounce, complaint, reject, renderingFailure, deliveryDelay]
        SnsDestination:
          TopicARN: !Ref MailEventsTopic

  # Every email counted in CloudWatch for the dashboard, by its kind (the
  # release-notes-mail tag: daily or account). Counts only; still no open
  # or click events.
  ConfigurationSetMetrics:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: mail-metrics
        Enabled: true
        MatchingEventTypes: [send, delivery, bounce, complaint, reject]
        CloudWatchDestination:
          DimensionConfigurations:
            - DimensionName: release-notes-mail
              DimensionValueSource: messageTag
              DefaultDimensionValue: other

  MailEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-mail-events"

  MailEventsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref MailEventsTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SesEvents
            Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref MailEventsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref Domain
      ConfigurationSetAttributes:
        ConfigurationSetName: !Ref ConfigurationSet
      DkimSigningAttributes:
        NextSigningKeyLength: RSA_2048_BIT
      MailFromAttributes:
        MailFromDomain: !Ref MailFromDomain
        BehaviorOnMxFailure: USE_DEFAULT_VALUE

  # --- receiving ------------------------------------------------------------

  ReceiptRuleSet:
    Type: AWS::SES::ReceiptRuleSet
    Properties:
      RuleSetName: !Ref AWS::StackName

  ReceiptRule:
    Type: AWS::SES::ReceiptRule
    DependsOn: [MailBucketPolicy, InboundInvokePermission]
    Properties:
      RuleSetName: !Ref ReceiptRuleSet
      Rule:
        Name: replies
        Enabled: true
        ScanEnabled: true
        TlsPolicy: Optional
        Recipients: [!Ref InboundDomain]
        Actions:
          - S3Action:
              BucketName: !Ref MailBucket
              ObjectKeyPrefix: raw/
          - LambdaAction:
              FunctionArn: !GetAtt InboundFunction.Arn
              InvocationType: Event

  # --- functions ------------------------------------------------------------

  SenderLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-sender"
      RetentionInDays: 90

  InboundLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-inbound"
      RetentionInDays: 90

  SenderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sender
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Scan, dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # The sender passes Content.Raw to SESv2 SendEmail, which SES
                # authorizes as ses:SendRawEmail. Recipients whose address is a
                # verified identity in this account are checked too, hence
                # identity/* rather than the sending domain alone.
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt SenderLogs.Arn

  InboundRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: inbound
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObjectTagging]
                Resource: !Sub "${MailBucket.Arn}/raw/*"
              - Effect: Allow
                # A reply's photos and recordings, copied out of it.
                Action: s3:PutObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt InboundLogs.Arn

  SenderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-sender"
      Description: Sends the daily version-number email
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.send.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt SenderRole.Arn
      MemorySize: 256
      Timeout: 120
      LoggingConfig:
        LogGroup: !Ref SenderLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          FROM_ADDRESS: !Ref FromAddress
          INBOUND_DOMAIN: !Ref InboundDomain
          CONFIG_SET: !Ref ConfigurationSet

  InboundFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-inbound"
      Description: Files email replies as release notes
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.inbound.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt InboundRole.Arn
      MemorySize: 512
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref InboundLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          BUCKET: !Ref MailBucket
          INBOUND_DOMAIN: !Ref InboundDomain

  InboundInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InboundFunction
      Action: lambda:InvokeFunction
      Principal: ses.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:receipt-rule-set/${AWS::StackName}:receipt-rule/replies"

  # Quarter hours, so a 20:00 send time lands at 20:00.
  SenderSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Run the Release Notes sender every 15 minutes
      ScheduleExpression: cron(0/15 * * * ? *)
      State: ENABLED
      Targets:
        - Id: sender
          Arn: !GetAtt SenderFunction.Arn

  SenderSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SenderFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SenderSchedule.Arn

  # --- web app: notes.yourversionnumber.com -----------------------------------
  #
  # The same shape as Drop and Thingy: CloudFront in front, a private S3
  # bucket of static pages as the default origin, and an HTTP API for /api/*.
  # Same origin for both, so there is no CORS and the session cookie is
  # host-only.

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-web-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ListBucket so a missing page is an honest 404, not S3's 403.
          - Sid: CloudFrontReads
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: [s3:GetObject, s3:ListBucket]
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub "${WebBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        Description: Private access from the Release Notes distribution to its web bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # /settings/ -> /settings/index.html. Static pages only; /api/* never runs it.
  WebIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-index"
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve directory indexes for the static pages
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  WebCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-static"
        Comment: Static pages, honouring the Cache-Control deploy.sh sets
        DefaultTTL: 300
        MinTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true

  # Pages load only their own files: no inline script or style, nothing
  # remote. Lookups that need another service (the city search) go through
  # /api. connect-src adds only Tinylytics, for app.js's page count. Photos
  # and recordings come from the mail bucket's own host, by a link the API
  # signs for their owner (img-src and media-src name only that host).
  WebHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-web"
        Comment: Security headers for notes.yourversionnumber.com
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://${MailBucket.RegionalDomainName}; media-src 'self' https://${MailBucket.RegionalDomainName}; font-src 'self'; connect-src 'self' https://tinylytics.app; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: same-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: false
            Preload: false
            Override: true

  # What the API sees of a request: only what it reads. The viewer's address
  # (for the sign-in email limits) is a CloudFront header, which the managed
  # AllViewer policies leave out; Host stays out so API Gateway gets its own.
  WebApiRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-api"
        Comment: Release Notes API - origin, content type, viewer address, session cookie
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Origin, Content-Type, Accept, CloudFront-Viewer-Address]
        CookiesConfig:
          CookieBehavior: whitelist
          Cookies: [__Host-rn]
        QueryStringsConfig:
          QueryStringBehavior: all

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Release Notes web app and its same-origin API
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [HasWebCertificate, [!Ref WebDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasWebCertificate
          - AcmCertificateArn: !Ref WebCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${WebApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref WebCachePolicy
          ResponseHeadersPolicyId: !Ref WebHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebIndexFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # The managed CachingDisabled policy, and our own origin request
          # policy below.
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !Ref WebApiRequestPolicy
            ResponseHeadersPolicyId: !Ref WebHeadersPolicy

  WebApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-web"
      Description: The Release Notes web app's API, reached through CloudFront at /api/*
      ProtocolType: HTTP

  WebApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt WebFunction.Arn
      PayloadFormatVersion: "2.0"

  WebApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebApi
      RouteKey: ANY /api/{proxy+}
      Target: !Sub "integrations/${WebApiIntegration}"

  # A ceiling for the whole API, well above one person's use. Per-address
  # and per-IP limits on sign-in mail live in the function.
  WebApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  WebInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref WebFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebApi}/*"

  WebLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-web"
      RetentionInDays: 90

  # Logs only for now. Table access arrives with the sign-in that needs it.
  WebRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: web
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # Sign-up writes the EMAIL and PROFILE items in one transaction,
                # which IAM authorizes as a PutItem for each. Deleting an
                # account deletes its items in batches.
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # The sign-in email, as raw MIME through SESv2 (see SenderRole).
                Action: [ses:SendEmail, ses:SendRawEmail]
                Resource:
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
                  - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}"
              - Effect: Allow
                # Deleting an emailed note (or the account) deletes the emails
                # behind it. The bucket is versioned: old versions expire 30
                # days on. DeleteObjects is authorized per object as this.
                Action: s3:DeleteObject
                Resource:
                  - !Sub "${MailBucket.Arn}/raw/*"
                  - !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # Signs the ten-minute link to a photo or recording for its
                # owner (web.media_file), and the link to a built zip export.
                # Nothing under raw/.
                Action: s3:GetObject
                Resource:
                  - !Sub "${MailBucket.Arn}/media/*"
                  - !Sub "${MailBucket.Arn}/exports/*"
              - Effect: Allow
                # A new zip export replaces the last; deleting the account
                # deletes it.
                Action: s3:DeleteObject
                Resource: !Sub "${MailBucket.Arn}/exports/*"
              - Effect: Allow
                # Starts a zip export, without waiting for it.
                Action: lambda:InvokeFunction
                Resource: !GetAtt ExportFunction.Arn
              - Effect: Allow
                # Sends a new subscriber today's email at sign-up, without
                # waiting for it (web.send_first).
                Action: lambda:InvokeFunction
                Resource: !GetAtt SenderFunction.Arn
              - Effect: Allow
                # Starting the emails again after a hard bounce or complaint
                # takes the address off SES's account-level suppression list
                # (web.unsuppress). The action takes no resource ARN.
                Action: ses:DeleteSuppressedDestination
                Resource: "*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WebLogs.Arn

  WebFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-web"
      Description: The Release Notes web app's API
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.web.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt WebRole.Arn
      MemorySize: 256
      # Under the HTTP API's 30 seconds, for deleting a long-kept account.
      Timeout: 28
      LoggingConfig:
        LogGroup: !Ref WebLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          WEB_ORIGIN: !Sub "https://${WebDomain}"
          FROM_ADDRESS: !Ref FromAddress
          CONFIG_SET: !Ref ConfigurationSet
          MAIL_BUCKET: !Ref MailBucket
          EXPORT_FUNCTION: !Ref ExportFunction
          SENDER_FUNCTION: !Ref SenderFunction

  # --- the zip export ---------------------------------------------------------
  # Every note, photo and recording in one zip, built in the background
  # (export_job.py) because it can outgrow an API answer. The web function
  # invokes it and the page asks how it is going.

  ExportLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-export"
      RetentionInDays: 90

  ExportRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: export
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # The photos and recordings that go in. Nothing under raw/.
                Action: s3:GetObject
                Resource: !Sub "${MailBucket.Arn}/media/*"
              - Effect: Allow
                # The zip, uploaded in parts when large; a replaced build
                # deletes its own.
                Action: [s3:PutObject, s3:AbortMultipartUpload, s3:DeleteObject]
                Resource: !Sub "${MailBucket.Arn}/exports/*"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ExportLogs.Arn

  ExportFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-export"
      Description: Builds a subscriber's zip export with every photo and recording
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.export_job.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt ExportRole.Arn
      MemorySize: 1024
      Timeout: 900
      # The zip is written to local disk before it is uploaded. Billed only
      # while a build runs.
      EphemeralStorage:
        Size: 10240
      LoggingConfig:
        LogGroup: !Ref ExportLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          MAIL_BUCKET: !Ref MailBucket

  # A failed build is marked failed and the person starts another; Lambda's
  # own retries would only race the new one.
  ExportInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref ExportFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0

  # --- bounces and complaints -----------------------------------------------
  # The configuration set already publishes delivery events to the alarms
  # topic for the ops queue. This function takes the hard bounces and
  # complaints from the same topic and stops that subscriber's emails.

  EventsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-events"
      RetentionInDays: 90

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                # The scrubbed line for the ops queue.
                Action: sns:Publish
                Resource: !Ref AlarmTopic
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt EventsLogs.Arn

  EventsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-events"
      Description: Stops a subscriber's emails after a hard bounce or a complaint; tells ops without addresses
      Runtime: python3.13
      Architectures: [arm64]
      Handler: release_notes.events.handler
      Code: { S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey }
      Role: !GetAtt EventsRole.Arn
      MemorySize: 128
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref EventsLogs
      Environment:
        Variables:
          TABLE: !Ref Table
          ALARM_TOPIC: !Ref AlarmTopic

  EventsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref MailEventsTopic
      Protocol: lambda
      Endpoint: !GetAtt EventsFunction.Arn

  EventsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventsFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref MailEventsTopic

  # --- alarms -----------------------------------------------------------------

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alarms"

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlarmTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudWatchAlarms
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlarmQueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: sqs
      Endpoint: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${OpsQueueName}"
      RawMessageDelivery: true

  SenderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-sender-errors"
      AlarmDescription: The daily sender failed. Someone may not have had today's email.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref SenderFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  WebErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-web-errors"
      AlarmDescription: The web app's API failed a request.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref WebFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  EventsErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-events-errors"
      AlarmDescription: A bounce or complaint could not be applied to its subscriber.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref EventsFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ExportErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-export-errors"
      AlarmDescription: A zip export failed to build. The page says so and offers to try again.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ExportFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  InboundErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-inbound-errors"
      AlarmDescription: A reply failed to file. The raw message is still in the mail bucket.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref InboundFunction }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Anyone's email overdue: their send time was over half an hour ago and
  # nothing went (census.py). A count from the sender's census line.
  OverdueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-overdue"
      AlarmDescription: Someone's daily email is over half an hour late. The sender may be failing, or a send time moved past today's window.
      Namespace: ReleaseNotes
      MetricName: Overdue
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The operations dashboard (Jamie, 2026-10-09). Counts only: no address,
  # no user id, no note text. Behind AWS sign-in, so nothing in the web app.
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref AWS::StackName
      DashboardBody: !Sub |
        {
          "start": "-P14D",
          "periodOverride": "inherit",
          "widgets": [
            {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {
              "markdown": "# Release Notes\nCounts only: no addresses, no note text. Subscribers, notes and writers come from the sender's census line every quarter hour (`census.py`); emails from SES; mail in and account events from the functions' logs, kept 90 days. One row per person: `scripts/subscribers.py`."}},
            {"type": "alarm", "x": 0, "y": 2, "width": 24, "height": 3, "properties": {
              "title": "Alarms",
              "alarms": ["${SenderErrorsAlarm.Arn}", "${OverdueAlarm.Arn}", "${InboundErrorsAlarm.Arn}", "${EventsErrorsAlarm.Arn}", "${WebErrorsAlarm.Arn}", "${ExportErrorsAlarm.Arn}"]}},
            {"type": "metric", "x": 0, "y": 5, "width": 24, "height": 4, "properties": {
              "title": "Right now", "view": "singleValue", "region": "${AWS::Region}",
              "period": 900, "stat": "Maximum", "setPeriodToTimeRange": false, "sparkline": true,
              "metrics": [
                ["ReleaseNotes", "Subscribers", {"label": "Getting the email"}],
                ["ReleaseNotes", "Paused", {"label": "Paused"}],
                ["ReleaseNotes", "Stopped", {"label": "Stopped"}],
                ["ReleaseNotes", "Overdue", {"label": "Email overdue"}],
                ["ReleaseNotes", "Notes", {"label": "Notes"}],
                ["ReleaseNotes", "Writers7", {"label": "Wrote this week"}],
                ["ReleaseNotes", "ReplyRate30", {"label": "Reply rate, 30 days (%)"}]
              ]}},
            {"type": "metric", "x": 0, "y": 9, "width": 12, "height": 6, "properties": {
              "title": "Emails a day, by kind (SES)", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 86400, "stat": "Sum",
              "metrics": [
                [{"expression": "SEARCH('{AWS/SES,\"release-notes-mail\"}', 'Sum', 86400)", "id": "mail"}]
              ]}},
            {"type": "metric", "x": 12, "y": 9, "width": 12, "height": 6, "properties": {
              "title": "SES account reputation", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 3600, "stat": "Maximum",
              "metrics": [
                ["AWS/SES", "Reputation.BounceRate", {"label": "Bounce rate"}],
                ["AWS/SES", "Reputation.ComplaintRate", {"label": "Complaint rate", "yAxis": "right"}]
              ],
              "annotations": {"horizontal": [
                {"value": 0.05, "label": "Bounces: AWS reviews at 5%"},
                {"value": 0.001, "label": "Complaints: AWS reviews at 0.1%", "yAxis": "right"}
              ]}}},
            {"type": "metric", "x": 0, "y": 15, "width": 12, "height": 6, "properties": {
              "title": "Notes added a day", "view": "timeSeries", "stacked": true, "region": "${AWS::Region}",
              "period": 86400, "stat": "Maximum",
              "metrics": [
                [{"expression": "DIFF(email)", "label": "By email", "id": "byEmail"}],
                [{"expression": "DIFF(web)", "label": "On the web", "id": "onWeb"}],
                ["ReleaseNotes", "EmailNotes", {"id": "email", "visible": false}],
                ["ReleaseNotes", "WebNotes", {"id": "web", "visible": false}]
              ]}},
            {"type": "metric", "x": 12, "y": 15, "width": 12, "height": 6, "properties": {
              "title": "Subscribers and writers", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 86400, "stat": "Maximum",
              "metrics": [
                ["ReleaseNotes", "Subscribers", {"label": "Getting the email"}],
                ["ReleaseNotes", "Writers7", {"label": "Wrote in the last 7 days"}],
                ["ReleaseNotes", "Writers30", {"label": "Wrote in the last 30 days"}],
                ["ReleaseNotes", "ReplyRate30", {"label": "Reply rate, 30 days (%)", "yAxis": "right"}]
              ]}},
            {"type": "log", "x": 0, "y": 21, "width": 12, "height": 6, "properties": {
              "title": "Mail in: filed or ignored, and why", "view": "table", "region": "${AWS::Region}",
              "query": "SOURCE '${InboundLogs}' | filter event = 'inbound' | stats count(*) as messages by outcome, reason | sort messages desc"}},
            {"type": "log", "x": 12, "y": 21, "width": 12, "height": 6, "properties": {
              "title": "Accounts: sign-ups, stops and sign-ins", "view": "table", "region": "${AWS::Region}",
              "query": "SOURCE '${WebLogs}' | SOURCE '${EventsLogs}' | filter event in ['signup', 'signin-sent', 'unsubscribe', 'pause', 'resume', 'account-deleted'] or (event = 'mail-event' and outcome = 'stopped') | stats count(*) as times by event, reason | sort times desc"}},
            {"type": "metric", "x": 0, "y": 27, "width": 8, "height": 6, "properties": {
              "title": "Function errors", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 3600, "stat": "Sum",
              "metrics": [
                ["AWS/Lambda", "Errors", "FunctionName", "${SenderFunction}", {"label": "sender"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${InboundFunction}", {"label": "inbound"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${WebFunction}", {"label": "web"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${EventsFunction}", {"label": "events"}],
                ["AWS/Lambda", "Errors", "FunctionName", "${ExportFunction}", {"label": "export"}]
              ]}},
            {"type": "metric", "x": 8, "y": 27, "width": 8, "height": 6, "properties": {
              "title": "Web API requests", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 3600, "stat": "Sum",
              "metrics": [
                ["AWS/ApiGateway", "Count", "ApiId", "${WebApi}", {"label": "requests"}],
                ["AWS/ApiGateway", "4xx", "ApiId", "${WebApi}", {"label": "4xx"}],
                ["AWS/ApiGateway", "5xx", "ApiId", "${WebApi}", {"label": "5xx"}]
              ]}},
            {"type": "metric", "x": 16, "y": 27, "width": 8, "height": 6, "properties": {
              "title": "Mail bucket size (emails, photos, exports)", "view": "timeSeries", "region": "${AWS::Region}",
              "period": 86400, "stat": "Average",
              "metrics": [
                ["AWS/S3", "BucketSizeBytes", "BucketName", "${MailBucket}", "StorageType", "StandardStorage", {"label": "bytes"}]
              ]}},
            {"type": "log", "x": 0, "y": 33, "width": 24, "height": 7, "properties": {
              "title": "Recent problems", "view": "table", "region": "${AWS::Region}",
              "query": "SOURCE '${SenderLogs}' | SOURCE '${InboundLogs}' | SOURCE '${WebLogs}' | SOURCE '${EventsLogs}' | SOURCE '${ExportLogs}' | filter (ispresent(event) and (event like /error|failed|out-of-time|census-skipped/ or status >= 500)) or (not ispresent(event) and @message like /ERROR|Task timed out/) | fields @timestamp, @log, coalesce(event, @message) as what, error, code, status | sort @timestamp desc | limit 25"}}
          ]
        }

Outputs:
  TableName:
    Value: !Ref Table
  MailBucketName:
    Value: !Ref MailBucket
  ReceiptRuleSetName:
    Value: !Ref ReceiptRuleSet
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  WebBucketName:
    Value: !Ref WebBucket
  WebDistributionId:
    Value: !Ref WebDistribution
  WebDistributionDomain:
    Description: Where the notes CNAME points
    Value: !GetAtt WebDistribution.DomainName
  DkimRecord1:
    Value: !Sub "${EmailIdentity.DkimDNSTokenName1} CNAME ${EmailIdentity.DkimDNSTokenValue1}"
  DkimRecord2:
    Value: !Sub "${EmailIdentity.DkimDNSTokenName2} CNAME ${EmailIdentity.DkimDNSTokenValue2}"
  DkimRecord3:
    Value: !Sub "${EmailIdentity.DkimDNSTokenName3} CNAME ${EmailIdentity.DkimDNSTokenValue3}"
  DashboardUrl:
    Description: The operations dashboard
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${Dashboard}"
