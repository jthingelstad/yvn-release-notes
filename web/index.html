<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Release Notes</title>
    <meta
      name="description"
      content="A journal that comes to you: a daily email with your version number, and your reply becomes that day's release notes. Free with the Weekly Thing."
    />
    <!-- Only the front page is for search and sharing: every other address
         serves this same file, and main.tsx marks those pages noindex. -->
    <link rel="canonical" href="https://notes.yourversionnumber.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Your Version Number" />
    <meta property="og:title" content="Release Notes" />
    <meta
      property="og:description"
      content="A journal that comes to you: a daily email with your version number, and your reply becomes that day's release notes. Free with the Weekly Thing."
    />
    <meta property="og:url" content="https://notes.yourversionnumber.com/" />
    <meta property="og:image" content="https://notes.yourversionnumber.com/brand/release-notes-paper-512.png" />
    <meta property="og:image:alt" content="The Release Notes mark: a blue V and an orange dot over two lines" />
    <meta name="twitter:card" content="summary" />
    <!-- Added to a Home Screen, it opens on Today as an app of its own. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Release Notes" />
    <meta name="theme-color" content="#fffbf2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14163a" media="(prefers-color-scheme: dark)" />
    <!-- React Aria adds a style element unless this id is taken; the CSP
         refuses inline styles, so site.css carries its one rule instead. -->
    <meta name="react-aria-pressable-style" id="react-aria-pressable-style" content="site.css" />
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
