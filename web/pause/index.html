<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pause: Release Notes</title>
<link rel="stylesheet" href="/assets/site.css?v=17">
<script src="/assets/app.js?v=25" defer></script>
</head>
<body data-page="pause">
<main>
  <header class="bar">
    <a class="brand" href="/">Release Notes</a>
    <a href="/today/">Today</a>
    <a href="/timeline/">Timeline</a>
    <a href="/search/">Search</a>
    <a href="/settings/">Settings</a>
  </header>

  <h1>Taking a break?</h1>
  <p class="lede">We&rsquo;ll stop the emails for a while and start them again on our own.</p>

  <div class="section" id="current" hidden>
    <p class="value" id="current-text"></p>
    <button class="quiet" type="button" id="resume">Start the emails again now</button>
    <p class="error" role="alert" hidden></p>
  </div>

  <form id="pause-form" class="roomy" novalidate hidden>
    <fieldset class="choices">
      <legend id="choose">Pause for</legend>
      <label class="choice"><input type="radio" name="len" value="3"> <span>3 days</span></label>
      <label class="choice"><input type="radio" name="len" value="7" checked> <span>1 week</span></label>
      <label class="choice"><input type="radio" name="len" value="14"> <span>2 weeks</span></label>
      <label class="choice"><input type="radio" name="len" value="until"> <span>Until a date I pick</span></label>
      <label class="until" hidden>Last day without an email
        <input type="date" name="through">
      </label>
    </fieldset>

    <div class="stack tight">
      <p class="value" id="preview"></p>
      <p class="hint">Paused days don&rsquo;t break your streak. You can still <a href="/day/">add notes for them</a>.</p>
    </div>

    <div class="stack tight">
      <div class="row">
        <button class="go" type="submit">Pause emails</button>
        <a href="/settings/">Not now</a>
      </div>
      <p class="error" role="alert" hidden></p>
    </div>
  </form>
</main>
</body>
</html>
