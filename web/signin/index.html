<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in: Release Notes</title>
<link rel="stylesheet" href="/assets/site.css?v=15">
<script src="/assets/app.js?v=23" defer></script>
</head>
<body data-page="signin">
<main>
  <header class="bar">
    <a class="brand" href="/">Release Notes</a>
  </header>

  <!-- A button, not an automatic sign-in: mail scanners open links, and
       opening this page must not use up the link. -->
  <h1 class="top">Sign in to Release Notes.</h1>
  <p class="lede">One tap finishes signing in on this device.</p>
  <form id="link-form">
    <button class="go" type="submit">Sign in</button>
    <p class="error" role="alert" hidden></p>
  </form>
</main>
</body>
</html>
