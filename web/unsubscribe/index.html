<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unsubscribe: Release Notes</title>
<link rel="stylesheet" href="/assets/site.css?v=17">
<script src="/assets/app.js?v=27" defer></script>
</head>
<body data-page="unsubscribe">
<main>
  <header class="bar">
    <a class="brand" href="/">Release Notes</a>
  </header>

  <section id="ask-stop">
    <h1 class="top">Stop the daily emails?</h1>
    <p class="lede">Your notes stay here. You can sign in any time to read them, export them or start the emails again.</p>
    <form id="stop-form">
      <button class="go" type="submit">Stop my emails</button>
      <p class="error" role="alert" hidden></p>
    </form>
  </section>

  <section id="stopped" hidden>
    <h1 class="top">Stopped.</h1>
    <p class="lede">No more daily emails. Your notes are still here: <a href="/#sign-in">sign in</a> to read or export them, or to start the emails again.</p>
  </section>
</main>
</body>
</html>
